<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMS Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }
        
        .upload-area.drag-over {
            border-color: #764ba2;
            background: #e8e9ff;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
            font-size: 0.9em;
        }
        
        input[type="number"], input[type="range"] {
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1em;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .progress {
            margin: 20px 0;
            display: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.85em;
        }
        
        .results {
            margin-top: 30px;
        }
        
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .preview-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
        }
        
        .preview-card img {
            width: 100%;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        .preview-card .filename {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            word-break: break-all;
        }
        
        .preview-card .detected {
            font-size: 0.85em;
            color: #666;
        }
        
        .status {
            padding: 10px 15px;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 0.9em;
        }
        
        .status.info {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Optical Mark Sheet Reader</h1>
        <p class="subtitle">Upload a PDF with multiple OMS pages to automatically detect shaded bubbles and generate named PNG files</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📄</div>
            <h3>Click to upload or drag & drop</h3>
            <p>PDF files only</p>
            <input type="file" id="fileInput" accept=".pdf">
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="threshold">Detection Threshold (0-255)</label>
                <input type="number" id="threshold" value="128" min="0" max="255">
            </div>
            
            <div class="control-group">
                <label for="rows">Number of Rows</label>
                <input type="number" id="rows" value="4" min="1" max="20">
            </div>
            
            <div class="control-group">
                <label for="cols">Bubbles per Row</label>
                <input type="number" id="cols" value="16" min="1" max="30">
            </div>
        </div>
        
        <button id="processBtn" disabled>Process PDF</button>
        <button id="downloadBtn" disabled style="margin-left: 10px;">Download All as ZIP</button>
        
        <div class="progress" id="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>
        
        <div id="status"></div>
        
        <div class="results">
            <div class="preview-grid" id="previewGrid"></div>
        </div>
    </div>

    <script>
        // Use a more reliable worker source or disable worker for compatibility
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
        
        let pdfDoc = null;
        let processedImages = [];
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const status = document.getElementById('status');
        const previewGrid = document.getElementById('previewGrid');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type === 'application/pdf') {
                handleFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        processBtn.addEventListener('click', processPDF);
        downloadBtn.addEventListener('click', downloadAllAsZip);
        
        async function handleFile(file) {
            showStatus('Loading PDF...', 'info');
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                pdfDoc = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                showStatus(`PDF loaded: ${pdfDoc.numPages} pages found`, 'success');
                processBtn.disabled = false;
            } catch (error) {
                showStatus('Error loading PDF: ' + error.message, 'error');
            }
        }
        
        async function processPDF() {
            if (!pdfDoc) return;
            
            processBtn.disabled = true;
            downloadBtn.disabled = true;
            progress.style.display = 'block';
            previewGrid.innerHTML = '';
            processedImages = [];
            
            const threshold = parseInt(document.getElementById('threshold').value);
            const numRows = parseInt(document.getElementById('rows').value);
            const numCols = parseInt(document.getElementById('cols').value);
            
            try {
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const scale = 2;
                    const viewport = page.getViewport({scale});
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;
                    
                    const detectedValues = detectBubbles(canvas, threshold, numRows, numCols);
                    const filename = detectedValues.join('') + '.png';
                    
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    
                    processedImages.push({
                        blob: blob,
                        filename: filename,
                        detected: detectedValues,
                        canvas: canvas
                    });
                    
                    addPreview(canvas, filename, detectedValues);
                    
                    const percent = Math.round((i / pdfDoc.numPages) * 100);
                    progressFill.style.width = percent + '%';
                    progressFill.textContent = percent + '%';
                }
                
                showStatus(`Successfully processed ${pdfDoc.numPages} pages!`, 'success');
                downloadBtn.disabled = false;
                
            } catch (error) {
                showStatus('Error processing PDF: ' + error.message, 'error');
            } finally {
                processBtn.disabled = false;
            }
        }
        
        function detectBubbles(canvas, threshold, numRows, numCols) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            const margin = 0.15;
            const startX = canvas.width * margin;
            const startY = canvas.height * margin;
            const endX = canvas.width * (1 - margin);
            const endY = canvas.height * (1 - margin);
            
            const cellWidth = (endX - startX) / numCols;
            const cellHeight = (endY - startY) / numRows;
            
            const labels = [];
            for (let i = 0; i < 10; i++) labels.push(i.toString());
            for (let i = 0; i < 6; i++) labels.push(String.fromCharCode(65 + i));
            
            const detectedValues = [];
            
            for (let row = 0; row < numRows; row++) {
                let darkestCol = -1;
                let darkestValue = 255;
                
                for (let col = 0; col < numCols; col++) {
                    const centerX = Math.floor(startX + col * cellWidth + cellWidth / 2);
                    const centerY = Math.floor(startY + row * cellHeight + cellHeight / 2);
                    
                    const radius = Math.min(cellWidth, cellHeight) * 0.3;
                    let totalDarkness = 0;
                    let pixelCount = 0;
                    
                    for (let dx = -radius; dx <= radius; dx++) {
                        for (let dy = -radius; dy <= radius; dy++) {
                            if (dx * dx + dy * dy <= radius * radius) {
                                const x = centerX + dx;
                                const y = centerY + dy;
                                
                                if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height) {
                                    const idx = (Math.floor(y) * canvas.width + Math.floor(x)) * 4;
                                    const brightness = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                                    totalDarkness += brightness;
                                    pixelCount++;
                                }
                            }
                        }
                    }
                    
                    const avgBrightness = totalDarkness / pixelCount;
                    
                    if (avgBrightness < darkestValue) {
                        darkestValue = avgBrightness;
                        darkestCol = col;
                    }
                }
                
                if (darkestCol !== -1 && darkestValue < threshold) {
                    detectedValues.push(labels[darkestCol] || darkestCol.toString());
                } else {
                    detectedValues.push('X');
                }
            }
            
            return detectedValues;
        }
        
        function addPreview(canvas, filename, detected) {
            const card = document.createElement('div');
            card.className = 'preview-card';
            
            const img = document.createElement('img');
            img.src = canvas.toDataURL();
            
            const filenameDiv = document.createElement('div');
            filenameDiv.className = 'filename';
            filenameDiv.textContent = filename;
            
            const detectedDiv = document.createElement('div');
            detectedDiv.className = 'detected';
            detectedDiv.textContent = `Detected: ${detected.join(', ')}`;
            
            card.appendChild(img);
            card.appendChild(filenameDiv);
            card.appendChild(detectedDiv);
            
            previewGrid.appendChild(card);
        }
        
        async function downloadAllAsZip() {
            if (processedImages.length === 0) return;
            
            showStatus('Creating ZIP file...', 'info');
            
            const zip = new JSZip();
            
            for (const img of processedImages) {
                zip.file(img.filename, img.blob);
            }
            
            const content = await zip.generateAsync({type: 'blob'});
            
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'oms_sheets.zip';
            a.click();
            URL.revokeObjectURL(url);
            
            showStatus('ZIP file downloaded!', 'success');
        }
        
        function showStatus(message, type) {
            status.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
    </script>
</body>
</html>
