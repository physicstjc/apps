<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Page Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        .drag-over {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .loader {
            border-top-color: #3b82f6;
            animation: spinner 0.6s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900 font-sans">

    <div class="max-w-4xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-4">PDF Page Extractor</h1>
            <p class="text-lg text-gray-600">Extract specific pages from a PDF file. Fast, free, and completely local.</p>
        </header>

        <!-- Dropzone -->
        <div id="dropzone" class="bg-white border-2 border-dashed border-gray-300 rounded-2xl p-10 text-center cursor-pointer hover:border-blue-500 transition-colors mb-8">
            <input type="file" id="fileInput" class="hidden" accept="application/pdf">
            <div class="flex flex-col items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-blue-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <p class="text-xl font-medium">Click to upload or drag and drop</p>
                <p class="text-sm text-gray-400 mt-2">Only .pdf files are supported</p>
            </div>
        </div>

        <!-- Configuration Area -->
        <div id="configArea" class="hidden bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8 p-6">
            <div class="flex items-center space-x-4 mb-6">
                 <div class="p-3 bg-red-100 rounded-lg">
                    <svg class="h-8 w-8 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" />
                    </svg>
                 </div>
                 <div>
                     <h3 class="text-lg font-semibold text-gray-900" id="fileName">document.pdf</h3>
                     <p class="text-sm text-gray-500" id="fileInfo">Loading...</p>
                 </div>
            </div>

            <div class="mb-4">
                <label for="pagesInput" class="block text-sm font-medium text-gray-700 mb-2">Pages to extract (1-based)</label>
                <input type="text" id="pagesInput" placeholder="e.g. 1-3, 5, 8-10" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                <p class="text-xs text-gray-500 mt-2">Enter page numbers and/or ranges separated by commas.</p>
            </div>
        </div>

        <!-- Actions -->
        <div id="actionArea" class="hidden flex flex-col sm:flex-row gap-4 justify-center items-center">
            <button id="clearBtn" class="px-6 py-3 rounded-xl border border-gray-300 text-gray-700 font-semibold hover:bg-gray-100 transition-colors w-full sm:w-auto">
                Clear
            </button>
            <button id="extractBtn" class="px-8 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all flex items-center justify-center w-full sm:w-auto min-w-[200px]">
                <span id="btnText">Extract & Download</span>
                <div id="spinner" class="hidden loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-5 w-5 ml-3"></div>
            </button>
        </div>

        <!-- Notification -->
        <div id="status" class="mt-6 text-center text-sm font-medium hidden"></div>
    </div>

    <script>
        const { PDFDocument } = PDFLib;
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const configArea = document.getElementById('configArea');
        const actionArea = document.getElementById('actionArea');
        const extractBtn = document.getElementById('extractBtn');
        const clearBtn = document.getElementById('clearBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const status = document.getElementById('status');
        const pagesInput = document.getElementById('pagesInput');
        const fileNameEl = document.getElementById('fileName');
        const fileInfoEl = document.getElementById('fileInfo');

        let sourcePdfBytes = null;
        let sourceFileName = 'extracted.pdf';
        let totalPages = null;

        // Trigger file input
        dropzone.addEventListener('click', () => fileInput.click());

        // File Selection
        fileInput.addEventListener('change', (e) => handleFile(e.target.files?.[0]));

        // Drag and Drop Events
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('drag-over');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('drag-over');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('drag-over');
            handleFile(e.dataTransfer.files?.[0]);
        });

        async function handleFile(file) {
            if (!file) return;
            
            if (file.type !== 'application/pdf') {
                showMessage('Please upload a valid PDF file.', 'text-red-600');
                return;
            }

            try {
                // Show loading state implicitly or explicitly if needed, but for now we just process
                sourcePdfBytes = new Uint8Array(await file.arrayBuffer());
                sourceFileName = file.name || 'document.pdf';
                
                const srcDoc = await PDFDocument.load(sourcePdfBytes);
                totalPages = srcDoc.getPageCount();

                // Update UI
                fileNameEl.textContent = sourceFileName;
                fileInfoEl.textContent = `${totalPages} pages | ${(file.size / 1024 / 1024).toFixed(2)} MB`;
                
                configArea.classList.remove('hidden');
                actionArea.classList.remove('hidden');
                dropzone.classList.add('hidden'); // Hide dropzone to focus on task
                pagesInput.focus();

            } catch (err) {
                console.error(err);
                showMessage('Failed to read PDF. The file may be corrupted or password-protected.', 'text-red-600');
            }
        }

        clearBtn.addEventListener('click', () => {
            fileInput.value = '';
            pagesInput.value = '';
            sourcePdfBytes = null;
            totalPages = null;
            configArea.classList.add('hidden');
            actionArea.classList.add('hidden');
            dropzone.classList.remove('hidden');
            status.classList.add('hidden');
        });

        extractBtn.addEventListener('click', async () => {
            if (!sourcePdfBytes || !totalPages) {
                showMessage('No PDF loaded.', 'text-red-600');
                return;
            }

            const spec = pagesInput.value;
            const { pages, warnings } = parsePageSpec(spec, totalPages);

            if (pages.length === 0) {
                showMessage(`No valid pages selected. ${warnings[0] || ''}`, 'text-amber-600');
                return;
            }

            setLoading(true);

            try {
                const srcDoc = await PDFDocument.load(sourcePdfBytes);
                const outDoc = await PDFDocument.create();

                const copiedPages = await outDoc.copyPages(srcDoc, pages);
                for (const p of copiedPages) outDoc.addPage(p);

                const outBytes = await outDoc.save();

                const base = safeBaseName(sourceFileName);
                const cleanSpec = spec.replace(/\s+/g,'').replace(/[^0-9,\-]/g,'') || 'selected';
                const outName = `${base}_pages_${cleanSpec}.pdf`;

                downloadBlob(outBytes, outName);
                
                let msg = `Extracted ${pages.length} page(s) successfully!`;
                if (warnings.length > 0) {
                    msg += ` (Warnings: ${warnings.length})`;
                    console.warn(warnings);
                }
                showMessage(msg, 'text-green-600');

            } catch (err) {
                console.error(err);
                showMessage('Extraction failed. Ensure file is not password protected.', 'text-red-600');
            } finally {
                setLoading(false);
            }
        });

        function parsePageSpec(spec, maxPages) {
            const warnings = [];
            if (!spec || !spec.trim()) {
                return { pages: [], warnings: ['No page range provided.'] };
            }

            const tokens = spec.split(',').map(t => t.trim()).filter(Boolean);
            const pageSet = new Set();

            for (const tok of tokens) {
                const mRange = tok.match(/^(\d+)\s*-\s*(\d+)$/);
                const mSingle = tok.match(/^(\d+)$/);

                if (mRange) {
                    let a = parseInt(mRange[1], 10);
                    let b = parseInt(mRange[2], 10);
                    if (a > b) [a, b] = [b, a];

                    for (let p = a; p <= b; p++) {
                        if (p < 1 || p > maxPages) {
                            warnings.push(`Ignoring out-of-range page ${p}`);
                            continue;
                        }
                        pageSet.add(p - 1);
                    }
                } else if (mSingle) {
                    const p = parseInt(mSingle[1], 10);
                    if (p < 1 || p > maxPages) {
                        warnings.push(`Ignoring out-of-range page ${p}`);
                        continue;
                    }
                    pageSet.add(p - 1);
                } else {
                    warnings.push(`Ignoring invalid token: "${tok}"`);
                }
            }

            const pages = Array.from(pageSet).sort((x, y) => x - y);
            return { pages, warnings };
        }

        function safeBaseName(filename) {
            const i = filename.lastIndexOf('.');
            return i > 0 ? filename.slice(0, i) : filename;
        }

        function setLoading(isLoading) {
            extractBtn.disabled = isLoading;
            if (isLoading) {
                btnText.innerText = 'Processing...';
                spinner.classList.remove('hidden');
                extractBtn.classList.add('opacity-75', 'cursor-not-allowed');
            } else {
                btnText.innerText = 'Extract & Download';
                spinner.classList.add('hidden');
                extractBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        function showMessage(msg, colorClass) {
            status.innerText = msg;
            status.className = `mt-6 text-center text-sm font-medium ${colorClass}`;
            status.classList.remove('hidden');
            // setTimeout(() => status.classList.add('hidden'), 5000); // Optional: keep it visible
        }

        function downloadBlob(bytes, filename) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
