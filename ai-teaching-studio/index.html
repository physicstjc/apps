<body><a class="skip" href="#main">Skip to workshop</a><aside><a class="brand" href="#intro"><span class="brand-icon">✳</span> IP Science Experiments <b>with AI</b></a><div class="side-label">PROFESSIONAL LEARNING</div><nav aria-label="Teaching tools" id="nav"></nav><div class="side-bottom"><div class="progress-label"><span>Your journey</span><span id="progress">0 / 4</span></div><div class="track"><i id="progressbar"></i></div><p>Explore. Design. Try. Reflect.</p><button class="textbutton" id="reset">Reset local progress</button></div></aside><div class="workspace"><header><span>Teaching & learning / <b id="crumb">Before we begin</b></span></header><main id="main" tabindex="-1"></main><footer><span>Designed for teacher judgement. Built around student thinking.</span><a href="#edcafe/resources">Sources & updates ↗</a></footer></div><div id="toast" role="status"></div><template id="intro-content"><div class="rationale-content"><h2>Two things to take into the classroom</h2>
<ol class="research-takeaways">
<li><h3>Keep students doing the thinking.</h3><p>Better work with AI does not always mean better learning. In a secondary-school maths trial, a general-purpose GPT-4 chatbot improved practice performance, but students scored <strong>17% lower on a later unaided test</strong> than the control group. A hint-based tutor largely avoided this drop, but did not significantly outperform the control.</p><p class="research-action"><b>For our lessons:</b> Ask for explanations, give hints before answers, and check what students can do without AI.</p><p class="research-citation"><a href="https://doi.org/10.1073/pnas.2422633122" target="_blank" rel="noopener">Bastani et al. (2025), PNAS ↗</a></p></li>
<li><h3>Test the learning design, not just the app.</h3><p>A purpose-built tutor produced larger immediate gains than in-class active learning in a Harvard physics trial. A review of <strong>69 experimental articles</strong> also found positive average effects on performance and motivation-related outcomes.</p><p class="research-limit"><b>Keep the limits in view:</b> The physics trial covered two university lessons. The review was mostly university-level, with many language studies. These findings do not establish long-term gains in secondary science or prove that Edcafe or Snorkl is better.</p><p class="research-action"><b>For our lessons:</b> Try a focused task, inspect students’ reasoning and compare independent learning before wider use.</p><p class="research-citation"><a href="https://doi.org/10.1038/s41598-025-97652-6" target="_blank" rel="noopener">Kestin et al. (2025), Scientific Reports ↗</a><br><a href="https://doi.org/10.1016/j.compedu.2024.105224" target="_blank" rel="noopener">Deng et al. (2025), Computers &amp; Education ↗</a></p></li>
</ol>
