<p id="rationale-intro">The main reason for this transition is MOE’s move to block general-purpose AI tools such as ChatGPT, Gemini and Claude on students’ Personal Learning Devices (PLDs). We therefore need to explore approved, education-purpose custom chatbots for classroom use.</p>
<ol class="rationale-reasons">
<li><b>Start with approved access on PLDs.</b><span>Choose tools permitted under the current MOE and school requirements. Check the whitelisted-app list and its conditions before assigning an activity.</span></li>
<li><b>Keep the learning ring-fenced.</b><span>Teachers set the task, reference material and feedback criteria, where supported, instead of starting with an unrestricted chat.</span></li>
<li><b>Keep students doing the thinking.</b><span>Students should explain, check evidence and revise. Avoid cognitive offloading: letting AI do the reasoning for them.</span></li>
<li><b>Use AI with safeguards.</b><span>MOE guidance emphasises safe, effective use after students develop basic concepts and thinking skills. Our trial follows that aim; teacher review and suitable settings still matter. <a href="https://www.learning.moe.edu.sg/about/ai-in-sls/responsible-ai/guidance-on-generative-ai/" target="_blank" rel="noopener">MOE guidance ↗</a></span></li>
</ol>
