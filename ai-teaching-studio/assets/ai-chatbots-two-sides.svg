<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1530" viewBox="0 0 1440 1530" role="img" aria-labelledby="title desc"><title id="title">AI for learning: a double-edged sword</title><desc id="desc">Laun and Wolff’s 2025 meta-analysis of 62 studies found a small to moderate learning benefit after adjusting for publication bias. Stronger effects occurred with text-based chatbots, STEM subjects, longer interventions and lower educational levels. Effective use: a purpose-built physics tutor supported larger immediate learning gains in a university trial. Risk: outsourcing homework thinking can replace practice. In a high-school maths trial, unguarded GPT-4 improved assisted practice but led to 17 percent lower subsequent unaided scores. That study tested practice, not homework directly. Guidance and independent checks matter.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#16365b}.kicker{font-size:18px;font-weight:700;letter-spacing:1.8px}.title{font-size:56px;font-weight:700;letter-spacing:-1.3px}.heading{font-size:35px;font-weight:700}.body{font-size:25px}.small{font-size:21px;fill:#526b87}.label{font-size:19px;font-weight:700}.white{fill:#fff}.blue{fill:#2165cf}.amber{fill:#855315}.muted{fill:#526b87}</style></defs><rect width="1440" height="1530" fill="#fff"/><rect width="1440" height="12" fill="#2165cf"/>
<text x="64" y="61" class="kicker blue">IP SCIENCE EXPERIMENTS WITH AI</text>
<text x="64" y="132" class="title">AI for learning:</text>
<text x="64" y="195" class="title">a double-edged sword</text>
<text x="64" y="239" class="body muted">The same technology can support thinking — or replace it.</text>
<g transform="translate(1282 143) rotate(35)"><path d="M0-69 17-39 12 28H-12L-17-39Z" fill="#edf5ff" stroke="#2165cf" stroke-width="3"/><path d="M0-58V28" stroke="#97b4d7" stroke-width="2"/><path d="M-31 29H31" stroke="#173f78" stroke-width="8" stroke-linecap="round"/><rect x="-7" y="34" width="14" height="35" rx="4" fill="#173f78"/><circle cy="73" r="9" fill="#2165cf"/></g>
<rect x="64" y="279" width="640" height="652" rx="24" fill="#f1f7ff" stroke="#cfdef1"/>
<rect x="736" y="279" width="640" height="652" rx="24" fill="#fff9ef" stroke="#e9d9bc"/>
<text x="96" y="325" class="kicker blue">THE OPPORTUNITY</text>
<text x="768" y="325" class="kicker amber">THE RISK</text>
<text x="96" y="390" class="heading">Effective chatbot-</text>
<text x="96" y="433" class="heading">supported learning</text>
<text x="768" y="390" class="heading">Using AI to do the</text>
<text x="768" y="433" class="heading">homework thinking</text>
<circle cx="101" cy="487" r="4" fill="#2165cf"/>
<text x="119" y="495" class="body">Attempt the task before asking</text>
<circle cx="101" cy="529" r="4" fill="#2165cf"/>
<text x="119" y="537" class="body">Use hints and timely feedback</text>
<circle cx="101" cy="571" r="4" fill="#2165cf"/>
<text x="119" y="579" class="body">Explain, check and revise</text>
<circle cx="773" cy="487" r="4" fill="#a66b1b"/>
<text x="791" y="495" class="body">Copy completed solutions</text>
<circle cx="773" cy="529" r="4" fill="#a66b1b"/>
<text x="791" y="537" class="body">Skip the steps and reasoning</text>
<circle cx="773" cy="571" r="4" fill="#a66b1b"/>
<text x="791" y="579" class="body">Mistake finished work for learning</text>
<rect x="96" y="612" width="576" height="62" rx="12" fill="#fff" stroke="#cfdef1"/>
<text x="117" y="650" class="label blue">Attempt → Hint → Explain → Retry</text>
<rect x="768" y="612" width="576" height="62" rx="12" fill="#fff" stroke="#e9d9bc"/>
<text x="789" y="650" class="label amber">Prompt → Copy → Submit</text>
<text x="96" y="721" class="kicker blue">EVIDENCE [1]</text>
<text x="96" y="761" class="small">A purpose-built physics tutor produced</text>
<text x="96" y="792" class="small">larger immediate learning gains than</text>
<text x="96" y="823" class="small">in-class active learning.</text>
<text x="96" y="877" class="small">Limit: two lessons in one university course.</text>
<text x="768" y="721" class="kicker amber">EVIDENCE [2]</text>
<text x="768" y="789" class="title amber">−17%</text>
<text x="980" y="765" class="body">on a later unaided</text>
<text x="980" y="797" class="body">maths test</text>
<text x="768" y="834" class="small">Unguarded GPT-4 versus the control group.</text>
<text x="768" y="877" class="small">High-school maths practice, not homework</text>
<text x="768" y="906" class="small">directly. A hint-based tutor avoided the drop.</text>
<rect x="64" y="962" width="1312" height="248" rx="22" fill="#f1f7ff" stroke="#cfdef1"/>
<text x="96" y="1005" class="kicker blue">THE WIDER EVIDENCE · 62 STUDIES [3]</text>
<text x="96" y="1050" class="heading">A small to moderate learning benefit</text>
<text x="96" y="1090" class="body">Laun &amp; Wolff (2025): the positive effect remained after adjusting for publication bias.</text>
<text x="96" y="1128" class="small">Stronger effects: text-based chatbots · STEM · longer interventions · lower educational levels.</text>
<text x="96" y="1166" class="small">Supports targeted use; does not establish the effectiveness of Edcafe or Snorkl specifically.</text>
<g transform="translate(0 280)"><rect x="64" y="962" width="1312" height="139" rx="22" fill="#173f78"/>
<text x="96" y="1005" class="kicker white">DESIGN FOR LEARNING, THEN CHECK INDEPENDENTLY</text>
<text x="96" y="1044" class="body white">Ask for reasoning. Use hints before answers. Check what students can do without AI.</text>
<text x="96" y="1078" class="small white">These findings do not prove that every chatbot helps, or that all AI homework use harms learning.</text>
<text x="64" y="1144" class="label">Research synthesis • 12 November 2026 • Context and design matter</text>
<text x="64" y="1180" class="small">[1] Kestin et al. (2025), Scientific Reports  |  [2] Bastani et al. (2025), PNAS</text>
<text x="64" y="1214" class="small">[3] Laun &amp; Wolff (2025), Learning and Individual Differences · doi:10.1016/j.lindif.2025.102646</text>
</g></svg>