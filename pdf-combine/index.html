<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure PDF Merger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        .drag-over {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .file-item {
            transition: all 0.2s ease;
        }
        .file-item:hover {
            transform: translateX(4px);
        }
        });

        function handleFiles(files) {
            const newFiles = Array.from(files).filter(f => f.type === 'application/pdf');
            if (newFiles.length === 0 && files.length > 0) {
                showMessage('Please upload PDF files only.', 'text-red-500');
                return;
            }
            filesArray = [...filesArray, ...newFiles];
            renderFileList();
        }

        function renderFileList() {
            if (filesArray.length === 0) {
                fileListContainer.classList.add('hidden');
                actionArea.classList.add('hidden');
                return;
            }

            fileListContainer.classList.remove('hidden');
            actionArea.classList.remove('hidden');
            fileList.innerHTML = '';

            filesArray.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = 'file-item p-4 flex items-center justify-between bg-white';
                li.setAttribute('data-id', index);
                li.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <svg class="h-6 w-6 text-red-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" />
                        </svg>
                        <span class="truncate font-medium text-gray-700">${file.name}</span>
                        <span class="text-xs text-gray-400">(${(file.size / 1024 / 1024).toFixed(2)} MB)</span>
                    </div>
                    <button onclick="removeFile(${index})" class="p-1 hover:bg-red-50 text-gray-400 hover:text-red-500 rounded transition-colors">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                `;
                fileList.appendChild(li);
            });
        }

        window.removeFile = (index) => {
            filesArray.splice(index, 1);
            renderFileList();
        };

        clearBtn.addEventListener('click', () => {
            filesArray = [];
            renderFileList();
            status.classList.add('hidden');
        });

        mergeBtn.addEventListener('click', async () => {
            if (filesArray.length < 2) {
                showMessage('Please add at least 2 PDF files to merge.', 'text-amber-600');
                return;
            }

            setLoading(true);
            let currentFile = null;
            try {
                const mergedPdf = await PDFDocument.create();

                for (const file of filesArray) {
                    currentFile = file;
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await PDFDocument.load(arrayBuffer);
                    const pdf = await PDFDocument.load(arrayBuffer, {
                        updateMetadata: false
                    });
                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                }
                showMessage('PDFs merged successfully!', 'text-green-600');
            } catch (error) {
                console.error(error);
                showMessage('Error merging PDFs. Ensure files are not password protected.', 'text-red-600');
                showMessage(getMergeErrorMessage(error, currentFile), 'text-red-600', 10000);
            } finally {
                setLoading(false);
            }
        });

        function getMergeErrorMessage(error, file) {
            const details = error instanceof Error ? error.message : String(error || '');
            const fileName = file ? `“${file.name}”` : 'One of the selected files';

            if (/encrypt|password/i.test(details)) {
                return `${fileName} is encrypted or password protected and cannot be merged.`;
            }

            if (/invalid|parse|header|trailer|catalog|object|page/i.test(details)) {
                return `${fileName} could not be read as a valid PDF. Try opening it and exporting or printing it as a new PDF, then merge again.`;
            }

            if (/memory|allocation|array buffer/i.test(details)) {
                return `There was not enough browser memory to process ${fileName}. Try fewer or smaller files.`;
            }

            return `Could not merge ${fileName}. The file may be damaged or use a PDF feature this merger does not support.`;
        }

        function setLoading(isLoading) {
            mergeBtn.disabled = isLoading;
            if (isLoading) {
            }
        }

        function showMessage(msg, colorClass) {
        function showMessage(msg, colorClass, duration = 5000) {
            status.innerText = msg;
            status.className = `mt-6 text-center text-sm font-medium ${colorClass}`;
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 5000);
            setTimeout(() => status.classList.add('hidden'), duration);
        }

        function downloadBlob(bytes, filename) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
