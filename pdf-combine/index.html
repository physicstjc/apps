<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure PDF Merger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        .drag-over {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        .file-item {
            transition: all 0.2s ease;
        }
        .file-item:hover {
            transform: translateX(4px);
        }
        .loader {
            border-top-color: #3b82f6;
            animation: spinner 0.6s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900 font-sans">

    <div class="max-w-4xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Combine PDFs</h1>
            <p class="text-lg text-gray-600">Merge multiple PDF files into one. Fast, free, and completely local.</p>
        </header>

        <!-- Dropzone -->
        <div id="dropzone" class="bg-white border-2 border-dashed border-gray-300 rounded-2xl p-10 text-center cursor-pointer hover:border-blue-500 transition-colors mb-8">
            <input type="file" id="fileInput" class="hidden" multiple accept="application/pdf">
            <div class="flex flex-col items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-blue-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="text-xl font-medium">Click to upload or drag and drop</p>
                <p class="text-sm text-gray-400 mt-2">Only .pdf files are supported</p>
            </div>
        </div>

        <!-- File List -->
        <div id="fileListContainer" class="hidden bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
            <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                <span class="font-semibold text-gray-700">Files to Merge</span>
                <span class="text-xs text-gray-500 italic">Drag to reorder</span>
            </div>
            <ul id="fileList" class="divide-y divide-gray-100">
                <!-- Dynamic Content -->
            </ul>
        </div>

        <!-- Actions -->
        <div id="actionArea" class="hidden flex flex-col sm:flex-row gap-4 justify-center items-center">
            <button id="clearBtn" class="px-6 py-3 rounded-xl border border-gray-300 text-gray-700 font-semibold hover:bg-gray-100 transition-colors w-full sm:w-auto">
                Clear All
            </button>
            <button id="mergeBtn" class="px-8 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all flex items-center justify-center w-full sm:w-auto min-w-[200px]">
                <span id="btnText">Merge & Download</span>
                <div id="spinner" class="hidden loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-5 w-5 ml-3"></div>
            </button>
        </div>

        <!-- Notification -->
        <div id="status" class="mt-6 text-center text-sm font-medium hidden"></div>
    </div>

    <script>
        const { PDFDocument } = PDFLib;
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const fileListContainer = document.getElementById('fileListContainer');
        const actionArea = document.getElementById('actionArea');
        const mergeBtn = document.getElementById('mergeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const status = document.getElementById('status');

        let filesArray = [];

        // Initialize Sortable for drag-and-drop reordering
        const sortable = new Sortable(fileList, {
            animation: 150,
            onEnd: function() {
                const newOrder = [];
                const items = fileList.querySelectorAll('li');
                items.forEach(item => {
                    const index = parseInt(item.getAttribute('data-id'));
                    newOrder.push(filesArray[index]);
                });
                filesArray = newOrder;
                renderFileList();
            }
        });

        // Trigger file input
        dropzone.addEventListener('click', () => fileInput.click());

        // File Selection
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        // Drag and Drop Events
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('drag-over');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('drag-over');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            const newFiles = Array.from(files).filter(f => f.type === 'application/pdf');
            if (newFiles.length === 0 && files.length > 0) {
                showMessage('Please upload PDF files only.', 'text-red-500');
                return;
            }
            filesArray = [...filesArray, ...newFiles];
            renderFileList();
        }

        function renderFileList() {
            if (filesArray.length === 0) {
                fileListContainer.classList.add('hidden');
                actionArea.classList.add('hidden');
                return;
            }

            fileListContainer.classList.remove('hidden');
            actionArea.classList.remove('hidden');
            fileList.innerHTML = '';

            filesArray.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = 'file-item p-4 flex items-center justify-between bg-white';
                li.setAttribute('data-id', index);
                li.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <svg class="h-6 w-6 text-red-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" />
                        </svg>
                        <span class="truncate font-medium text-gray-700">${file.name}</span>
                        <span class="text-xs text-gray-400">(${(file.size / 1024 / 1024).toFixed(2)} MB)</span>
                    </div>
                    <button onclick="removeFile(${index})" class="p-1 hover:bg-red-50 text-gray-400 hover:text-red-500 rounded transition-colors">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                `;
                fileList.appendChild(li);
            });
        }

        window.removeFile = (index) => {
            filesArray.splice(index, 1);
            renderFileList();
        };

        clearBtn.addEventListener('click', () => {
            filesArray = [];
            renderFileList();
            status.classList.add('hidden');
        });

        mergeBtn.addEventListener('click', async () => {
            if (filesArray.length < 2) {
                showMessage('Please add at least 2 PDF files to merge.', 'text-amber-600');
                return;
            }

            setLoading(true);
            try {
                const mergedPdf = await PDFDocument.create();

                for (const file of filesArray) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await PDFDocument.load(arrayBuffer);
                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                }

                const mergedPdfBytes = await mergedPdf.save();
                downloadBlob(mergedPdfBytes, 'merged_document.pdf');
                showMessage('PDFs merged successfully!', 'text-green-600');
            } catch (error) {
                console.error(error);
                showMessage('Error merging PDFs. Ensure files are not password protected.', 'text-red-600');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            mergeBtn.disabled = isLoading;
            if (isLoading) {
                btnText.innerText = 'Processing...';
                spinner.classList.remove('hidden');
                mergeBtn.classList.add('opacity-75', 'cursor-not-allowed');
            } else {
                btnText.innerText = 'Merge & Download';
                spinner.classList.add('hidden');
                mergeBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        function showMessage(msg, colorClass) {
            status.innerText = msg;
            status.className = `mt-6 text-center text-sm font-medium ${colorClass}`;
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 5000);
        }

        function downloadBlob(bytes, filename) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
