<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hike Elevation Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header h1 {
            color: #4a5568;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 300;
        }

        .header p {
            color: #718096;
            font-size: 1.1em;
        }

        .controls {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-stop {
            background: linear-gradient(45deg, #e53e3e, #c53030);
        }

        .status {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            background: #e53e3e;
        }

        .status-indicator.active {
            background: #38a169;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .metric-label {
            color: #718096;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .data-log {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .data-log h3 {
            margin-bottom: 20px;
            color: #4a5568;
            font-size: 1.5em;
        }

        .log-entries {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
        }

        .log-entry {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 0.9em;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 15px;
            align-items: center;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: #667eea;
            font-weight: bold;
        }

        .log-data {
            color: #4a5568;
        }

        .log-elevation {
            color: #38a169;
            font-weight: bold;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏔️ Hike Elevation Tracker</h1>
            <p>Track pressure changes and estimate elevation gain using device sensors</p>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn">Start Tracking</button>
            <button id="stopBtn" class="btn btn-stop" disabled>Stop Tracking</button>
            <button id="clearBtn" class="btn">Clear Data</button>
            <button id="exportBtn" class="btn">Export Data</button>
        </div>

        <div class="status">
            <div>
                <span id="statusIndicator" class="status-indicator"></span>
                <span id="statusText">Ready to track</span>
            </div>
        </div>

        <div id="errorContainer"></div>

        <div class="metrics">
            <div class="metric-card">
                <div id="currentPressure" class="metric-value">--</div>
                <div class="metric-label">Pressure (hPa)</div>
            </div>
            <div class="metric-card">
                <div id="currentAltitude" class="metric-value">--</div>
                <div class="metric-label">GPS Alt (m)</div>
            </div>
            <div class="metric-card">
                <div id="estimatedElevation" class="metric-value">--</div>
                <div class="metric-label">Est. Elevation (m)</div>
            </div>
            <div class="metric-card">
                <div id="elevationGain" class="metric-value">--</div>
                <div class="metric-label">Total Gain (m)</div>
            </div>
        </div>

        <div class="data-log">
            <h3>Data Log</h3>
            <div class="log-entries" id="logEntries">
                <div class="log-entry">
                    <div class="log-time">Ready</div>
                    <div class="log-data">Click "Start Tracking" to begin recording sensor data</div>
                    <div class="log-elevation">--</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class HikeTracker {
            constructor() {
                this.isTracking = false;
                this.data = [];
                this.baselinePressure = null;
                this.baselineElevation = null;
                this.totalElevationGain = 0;
                this.lastElevation = null;
                this.watchId = null;
                
                this.initializeElements();
                this.attachEventListeners();
                this.checkSensorSupport();
            }

            initializeElements() {
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.exportBtn = document.getElementById('exportBtn');
                this.statusIndicator = document.getElementById('statusIndicator');
                this.statusText = document.getElementById('statusText');
                this.errorContainer = document.getElementById('errorContainer');
                this.logEntries = document.getElementById('logEntries');
                
                // Metric displays
                this.currentPressure = document.getElementById('currentPressure');
                this.currentAltitude = document.getElementById('currentAltitude');
                this.estimatedElevation = document.getElementById('estimatedElevation');
                this.elevationGain = document.getElementById('elevationGain');
            }

            attachEventListeners() {
                this.startBtn.addEventListener('click', () => this.startTracking());
                this.stopBtn.addEventListener('click', () => this.stopTracking());
                this.clearBtn.addEventListener('click', () => this.clearData());
                this.exportBtn.addEventListener('click', () => this.exportData());
            }

            checkSensorSupport() {
                const support = {
                    geolocation: 'geolocation' in navigator,
                    deviceOrientation: 'DeviceOrientationEvent' in window,
                    genericSensor: 'Accelerometer' in window || 'AbsoluteOrientationSensor' in window
                };

                if (!support.geolocation) {
                    this.showError('GPS/Geolocation is not supported on this device');
                }

                // Note: Barometer access through Web APIs is limited
                // We'll estimate pressure from GPS altitude when direct pressure isn't available
            }

            async startTracking() {
                try {
                    this.isTracking = true;
                    this.startBtn.disabled = true;
                    this.stopBtn.disabled = false;
                    this.statusIndicator.classList.add('active');
                    this.statusText.textContent = 'Tracking active';
                    
                    this.clearError();
                    
                    // Request location permission and start tracking
                    await this.startLocationTracking();
                    
                    // Try to access device orientation for additional sensor data
                    this.requestDeviceOrientation();
                    
                } catch (error) {
                    this.showError(`Failed to start tracking: ${error.message}`);
                    this.stopTracking();
                }
            }

            async startLocationTracking() {
                if (!navigator.geolocation) {
                    throw new Error('Geolocation is not supported');
                }

                const options = {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 10000
                };

                this.watchId = navigator.geolocation.watchPosition(
                    (position) => this.handleLocationUpdate(position),
                    (error) => this.handleLocationError(error),
                    options
                );
            }

            requestDeviceOrientation() {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(permission => {
                            if (permission === 'granted') {
                                window.addEventListener('deviceorientation', (event) => {
                                    // Store orientation data for context
                                    this.lastOrientation = {
                                        alpha: event.alpha,
                                        beta: event.beta,
                                        gamma: event.gamma
                                    };
                                });
                            }
                        })
                        .catch(console.error);
                }
            }

            handleLocationUpdate(position) {
                if (!this.isTracking) return;

                const coords = position.coords;
                const timestamp = new Date();
                
                // Estimate pressure from altitude (standard atmosphere model)
                const estimatedPressure = coords.altitude ? 
                    this.calculatePressureFromAltitude(coords.altitude) : null;

                // Calculate elevation from pressure if we have baseline
                const estimatedElevationFromPressure = estimatedPressure && this.baselinePressure ?
                    this.calculateElevationFromPressure(estimatedPressure) : null;

                const dataPoint = {
                    timestamp: timestamp,
                    latitude: coords.latitude,
                    longitude: coords.longitude,
                    gpsAltitude: coords.altitude,
                    accuracy: coords.accuracy,
                    altitudeAccuracy: coords.altitudeAccuracy,
                    estimatedPressure: estimatedPressure,
                    estimatedElevation: estimatedElevationFromPressure,
                    heading: coords.heading,
                    speed: coords.speed
                };

                // Set baseline on first reading
                if (this.data.length === 0) {
                    this.baselinePressure = estimatedPressure;
                    this.baselineElevation = coords.altitude || 0;
                    this.lastElevation = coords.altitude || 0;
                }

                // Calculate elevation gain
                if (coords.altitude && this.lastElevation !== null) {
                    const elevationChange = coords.altitude - this.lastElevation;
                    if (elevationChange > 0.5) { // Only count significant gains
                        this.totalElevationGain += elevationChange;
                    }
                    this.lastElevation = coords.altitude;
                }

                this.data.push(dataPoint);
                this.updateDisplay(dataPoint);
                this.addLogEntry(dataPoint);
            }

            handleLocationError(error) {
                let errorMessage = 'Location error: ';
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        errorMessage += 'Location permission denied';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        errorMessage += 'Location information unavailable';
                        break;
                    case error.TIMEOUT:
                        errorMessage += 'Location request timed out';
                        break;
                    default:
                        errorMessage += 'Unknown location error';
                        break;
                }
                this.showError(errorMessage);
            }

            calculatePressureFromAltitude(altitude) {
                // Standard atmosphere model: P = P0 * (1 - 0.0065 * h / T0)^(g * M / (R * 0.0065))
                // Simplified: P ≈ 1013.25 * (1 - altitude / 44330.77)^5.255
                const P0 = 1013.25; // Sea level pressure in hPa
                const pressure = P0 * Math.pow(1 - altitude / 44330.77, 5.255);
                return Math.round(pressure * 10) / 10;
            }

            calculateElevationFromPressure(pressure) {
                // Inverse of pressure calculation
                const P0 = 1013.25;
                const elevation = 44330.77 * (1 - Math.pow(pressure / P0, 1/5.255));
                return Math.round(elevation * 10) / 10;
            }

            updateDisplay(dataPoint) {
                this.currentPressure.textContent = dataPoint.estimatedPressure ? 
                    dataPoint.estimatedPressure.toFixed(1) : '--';
                
                this.currentAltitude.textContent = dataPoint.gpsAltitude ? 
                    dataPoint.gpsAltitude.toFixed(1) : '--';
                
                this.estimatedElevation.textContent = dataPoint.estimatedElevation ? 
                    dataPoint.estimatedElevation.toFixed(1) : '--';
                
                this.elevationGain.textContent = this.totalElevationGain.toFixed(1);
            }

            addLogEntry(dataPoint) {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                
                const timeStr = dataPoint.timestamp.toLocaleTimeString();
                const pressureStr = dataPoint.estimatedPressure ? 
                    `${dataPoint.estimatedPressure.toFixed(1)} hPa` : 'N/A';
                const altStr = dataPoint.gpsAltitude ? 
                    `GPS: ${dataPoint.gpsAltitude.toFixed(1)}m` : 'GPS: N/A';
                const elevStr = dataPoint.estimatedElevation ? 
                    `${dataPoint.estimatedElevation.toFixed(1)}m` : '--';

                entry.innerHTML = `
                    <div class="log-time">${timeStr}</div>
                    <div class="log-data">${pressureStr} | ${altStr}</div>
                    <div class="log-elevation">${elevStr}</div>
                `;

                this.logEntries.insertBefore(entry, this.logEntries.firstChild);

                // Keep only last 50 entries in view
                while (this.logEntries.children.length > 50) {
                    this.logEntries.removeChild(this.logEntries.lastChild);
                }
            }

            stopTracking() {
                this.isTracking = false;
                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                this.statusIndicator.classList.remove('active');
                this.statusText.textContent = 'Tracking stopped';

                if (this.watchId !== null) {
                    navigator.geolocation.clearWatch(this.watchId);
                    this.watchId = null;
                }
            }

            clearData() {
                this.data = [];
                this.baselinePressure = null;
                this.baselineElevation = null;
                this.totalElevationGain = 0;
                this.lastElevation = null;
                
                // Reset displays
                this.currentPressure.textContent = '--';
                this.currentAltitude.textContent = '--';
                this.estimatedElevation.textContent = '--';
                this.elevationGain.textContent = '--';
                
                // Clear log
                this.logEntries.innerHTML = `
                    <div class="log-entry">
                        <div class="log-time">Ready</div>
                        <div class="log-data">Data cleared - ready for new tracking session</div>
                        <div class="log-elevation">--</div>
                    </div>
                `;
            }

            exportData() {
                if (this.data.length === 0) {
                    this.showError('No data to export');
                    return;
                }

                const csvHeader = 'Timestamp,Latitude,Longitude,GPS_Altitude_m,Estimated_Pressure_hPa,Estimated_Elevation_m,Accuracy_m,Speed_ms,Heading_deg\n';
                const csvData = this.data.map(point => {
                    return [
                        point.timestamp.toISOString(),
                        point.latitude,
                        point.longitude,
                        point.gpsAltitude || '',
                        point.estimatedPressure || '',
                        point.estimatedElevation || '',
                        point.accuracy || '',
                        point.speed || '',
                        point.heading || ''
                    ].join(',');
                }).join('\n');

                const blob = new Blob([csvHeader + csvData], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `hike_data_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            showError(message) {
                this.errorContainer.innerHTML = `<div class="error">${message}</div>`;
            }

            clearError() {
                this.errorContainer.innerHTML = '';
            }
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            new HikeTracker();
        });
    </script>
</body>
</html>
