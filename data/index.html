<!DOCTYPE html>
<html>
<head>
  <title>Google Sheet Updater</title>
</head>
<body>
  <h2>Update Google Sheet</h2>
  <form id="dataForm">
    Name: <input type="text" id="name"><br>
    Email: <input type="text" id="email"><br>
    <button type="submit">Submit</button>
  </form>

  <script>
    document.getElementById("dataForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;

    fetch(`https://script.google.com/a/macros/moe.edu.sg/s/AKfycb.../exec?name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`)
      .then(res => res.text())
      .then(data => alert("Submitted: " + data))
      .catch(err => console.error(err));

  </script>
</body>
</html>
