<!DOCTYPE html>
<html>
<head>
  <title>Google Sheet Updater</title>
</head>
<body>
  <h2>Update Google Sheet</h2>
  <form id="dataForm">
    Name: <input type="text" id="name"><br>
    Email: <input type="text" id="email"><br>
    <button type="submit">Submit</button>
  </form>

  <script>
    document.getElementById("dataForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;

      fetch("https://script.google.com/a/macros/moe.edu.sg/s/AKfycbxzZZZHsFjKMJLDmazes2UHflwJ3SwI7r8-CDxP4KQ7DkXmCBt1g-ylh5WDV9XVwTAz/exec", {
        method: "POST",
        body: JSON.stringify({ name, email }),
        headers: {
          "Content-Type": "application/json"
        }
      })
      .then(response => response.text())
      .then(data => alert("Submitted: " + data))
      .catch(error => alert("Error: " + error));
    });
  </script>
</body>
</html>
