<form id="dataForm">
  Name: <input type="text" id="name"><br>
  Email: <input type="text" id="email"><br>
  <button type="submit">Submit</button>
</form>

<script>
  document.getElementById("dataForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    const url = `https://script.google.com/macros/s/AKfycbx8lW-42lze7cXSds8zjysmObgnVywKFQQnhDzrhauXbJw9x6SAG8P-U0B5yq7vimfvqQ/exec?name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`;

    fetch(url)
      .then(response => response.text())
      .then(data => alert("Submitted: " + data))
      .catch(err => console.error("Error:", err));
  });
</script>
