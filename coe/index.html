<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>COE Premium Trends</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    label, select {
      font-size: 1rem;
      margin-top: 20px;
    }
    canvas {
      margin-top: 30px;
    }
    #yearControls {
      margin: 20px 0;
    }
    #clickInfo {
      margin-top: 20px;
      font-size: 1rem;
      background: #eef;
      padding: 10px;
      border-left: 4px solid #339;
      border-radius: 5px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>📈 COE Premium Trends (by Bidding Round)</h1>
  <label for="vehicleClassSelect">Select Vehicle Class:</label>
  <select id="vehicleClassSelect"></select>

  <div id="yearControls">
    <input type="checkbox" id="toggleAllYears" checked>
    <label for="toggleAllYears"><strong>Select / Unselect All Years</strong></label>
    <div id="yearCheckboxes" style="margin-top: 10px;"></div>

    <div style="margin: 10px 0;">
      <input type="checkbox" id="toggleQuota" checked>
      <label for="toggleQuota">Show Quota (Dotted Line)</label>
    </div>
  </div>

  <canvas id="coeChart" width="800" height="400"></canvas>
  <div id="clickInfo"></div>

  <script>
    const datasetId = "d_69b3380ad7e51aff3a7dcc84eba52b8a";
    const url = "https://data.gov.sg/api/action/datastore_search?resource_id=" + datasetId + "&limit=10000";

    const select = document.getElementById("vehicleClassSelect");
    const ctx = document.getElementById("coeChart").getContext("2d");
    const yearCheckboxesDiv = document.getElementById("yearCheckboxes");
    const toggleAll = document.getElementById("toggleAllYears");
    const toggleQuota = document.getElementById("toggleQuota");
    const clickInfo = document.getElementById("clickInfo");

    let chart;
    let parsedData = [];
    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    fetch(url)
      .then(response => {
        if (!response.ok) throw new Error("Failed to fetch data");
        return response.json();
      })
      .then(data => {
        const records = data.result.records;

        parsedData = records.map(r => {
          const [year, month] = r.month.split("-");
          const monthLabel = monthNames[parseInt(month, 10) - 1];
          const biddingLabel = `${monthLabel}-${r.bidding_no}`;
          return {
            bidding_label: biddingLabel,
            year: parseInt(year),
            vehicle_class: r.vehicle_class,
            premium: parseFloat(r.premium),
            quota: parseInt(r.quota)
          };
        }).filter(r => !isNaN(r.premium));

        const vehicleClasses = [...new Set(parsedData.map(r => r.vehicle_class))].sort();
        vehicleClasses.forEach(vc => {
          const option = document.createElement("option");
          option.value = vc;
          option.textContent = vc;
          select.appendChild(option);
        });

        select.value = vehicleClasses[0];
        updateChart(select.value);

        select.addEventListener("change", () => {
          updateChart(select.value);
        });
      })
      .catch(error => {
        console.error("Error fetching data:", error);
      });

    function updateChart(selectedClass) {
      const data = parsedData.filter(d => d.vehicle_class === selectedClass);
      if (data.length === 0) return;

      const labelOrder = monthNames.flatMap(m => [`${m}-1`, `${m}-2`]);
      const grouped = {};
      data.forEach(entry => {
        if (!grouped[entry.year]) grouped[entry.year] = [];
        grouped[entry.year].push(entry);
      });

      const currentYear = new Date().getFullYear();
      const datasets = [];
      const colorPalette = [
        '#3366cc', '#dc3912', '#ff9900', '#109618', '#990099',
        '#0099c6', '#dd4477', '#66aa00', '#b82e2e', '#316395'
      ];
      let colorIndex = 0;

      Object.entries(grouped).forEach(([year, values]) => {
        const premiumData = [];
        const quotaData = [];

        const yearColor = colorPalette[colorIndex % colorPalette.length];
        colorIndex++;

        labelOrder.forEach(label => {
          const match = values.find(v => v.bidding_label === label);
          premiumData.push(match ? match.premium : null);
          quotaData.push(match && match.quota ? match.quota : null);
        });

        // Premium dataset
        datasets.push({
          label: year,
          data: premiumData,
          spanGaps: true,
          fill: false,
          tension: 0.2,
          borderWidth: 1,
          pointRadius: 2,
          pointHoverRadius: 5,
          hitRadius: 10,
          pointStyle: 'circle',
          hidden: parseInt(year) !== currentYear,
          borderColor: yearColor,
          yAxisID: 'y'
        });

        // Quota dataset (dotted)
        datasets.push({
          label: year + ' Quota',
          data: quotaData,
          spanGaps: true,
          fill: false,
          tension: 0.2,
          borderWidth: 1,
          borderDash: [4, 4],
          pointRadius: 0,
          hidden: !toggleQuota.checked || parseInt(year) !== currentYear,
          borderColor: yearColor,
          yAxisID: 'y1'
        });
      });

      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labelOrder,
          datasets
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'top',
              labels: {
                filter: function(legendItem, data) {
                  const label = legendItem.text;
                  const dataset = data.datasets[legendItem.datasetIndex];
                  // ✅ Show only premium (non-quota) lines that are currently visible
                  return !label.endsWith("Quota") && !dataset.hidden;
                }
              }
            },
            title: {
              display: true,
              text: `COE Premiums for ${selectedClass} (Overlayed by Year)`
            }
          },
          scales: {
            x: {
              title: { display: true, text: 'Bidding Round (Month-Bid)' }
            },
            y: {
              title: { display: true, text: 'Premium (S$)' },
              beginAtZero: true
            },
            y1: {
              title: { display: true, text: 'Quota' },
              beginAtZero: true,
              position: 'right',
              grid: {
                drawOnChartArea: false
              }
            }
          },
          onClick(evt, activeElements) {
            if (activeElements.length > 0) {
              const element = activeElements[0];
              const datasetIndex = element.datasetIndex;
              const index = element.index;
              const dataset = chart.data.datasets[datasetIndex];

              // Only respond to premium lines
              if (dataset.label.endsWith("Quota")) return;

              const year = dataset.label;
              const round = chart.data.labels[index];
              const premium = dataset.data[index];
              const output = `🗓 Year: ${year}<br>📆 Bidding Round: ${round}<br>💰 Premium: $${premium.toLocaleString()}`;
              clickInfo.innerHTML = output;
            }
          }
        }
      });

      // === Create checkboxes ===
      yearCheckboxesDiv.innerHTML = '';
      datasets.forEach((ds, i) => {
        if (ds.label.endsWith('Quota')) return; // skip quota lines

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = parseInt(ds.label) === currentYear;
        checkbox.id = `year-${ds.label}`;
        checkbox.dataset.index = i;

        checkbox.addEventListener('change', (e) => {
          const idx = parseInt(e.target.dataset.index);
          chart.data.datasets[idx].hidden = !e.target.checked;

          // Also toggle the matching quota line (index + 1)
          const quotaDataset = chart.data.datasets[idx + 1];
            if (quotaDataset.label.endsWith('Quota')) {
              quotaDataset.hidden = !e.target.checked || !toggleQuota.checked;
            }

          chart.update();

          // Update toggleAll state
          const allChecked = [...yearCheckboxesDiv.querySelectorAll('input')].every(cb => cb.checked);
          toggleAll.checked = allChecked;
        });

        const label = document.createElement('label');
        label.htmlFor = checkbox.id;
        label.style.marginRight = '15px';
        label.textContent = ds.label;

        yearCheckboxesDiv.appendChild(checkbox);
        yearCheckboxesDiv.appendChild(label);
      });

      // Toggle All logic
      toggleAll.checked = false;
        toggleAll.onchange = function () {
          const checkboxes = yearCheckboxesDiv.querySelectorAll('input[type="checkbox"]');
          checkboxes.forEach(cb => {
            cb.checked = toggleAll.checked;
            const idx = parseInt(cb.dataset.index);
            chart.data.datasets[idx].hidden = !cb.checked;

            const quotaDataset = chart.data.datasets[idx + 1];
            if (quotaDataset.label.endsWith('Quota')) {
              quotaDataset.hidden = !cb.checked || !toggleQuota.checked;
            }
          });
          chart.update();
        };


      // Toggle Quota logic
        toggleQuota.onchange = function () {
          const checkboxes = yearCheckboxesDiv.querySelectorAll('input[type="checkbox"]');
          checkboxes.forEach(cb => {
            const idx = parseInt(cb.dataset.index);
            const quotaDataset = chart.data.datasets[idx + 1];
            if (quotaDataset.label.endsWith('Quota')) {
              quotaDataset.hidden = !toggleQuota.checked || !cb.checked;
            }
          });
          chart.update();
        };

    }
  </script>
</body>
</html>
