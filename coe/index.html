<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>COE Premium Trends</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    label, select {
      font-size: 1rem;
      margin-top: 20px;
    }
    canvas {
      margin-top: 30px;
    }
    #yearControls {
      margin: 20px 0;
    }
    #clickInfo {
      margin-top: 20px;
      font-size: 1rem;
      background: #eef;
      padding: 10px;
      border-left: 4px solid #339;
      border-radius: 5px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>📈 COE Premium Trends (by Bidding Round)</h1>
  <label for="vehicleClassSelect">Select Vehicle Class:</label>
  <select id="vehicleClassSelect"></select>

  <div id="yearControls">
    <input type="checkbox" id="toggleAllYears" checked>
    <label for="toggleAllYears"><strong>Select / Unselect All Years</strong></label>
    <div id="yearCheckboxes" style="margin-top: 10px;"></div>

    <div style="margin: 10px 0;">
      <input type="checkbox" id="toggleQuota" checked>
      <label for="toggleQuota">Show Quota (Dotted Line)</label><br>
      <input type="checkbox" id="toggleBids" checked>
      <label for="toggleBids">Show Bids Received (Bold Dotted Line)</label>
    </div>
  </div>

  <canvas id="coeChart" width="800" height="400"></canvas>
  <div id="clickInfo"></div>

  <script>
    const datasetId = "d_69b3380ad7e51aff3a7dcc84eba52b8a";
    const url = "https://data.gov.sg/api/action/datastore_search?resource_id=" + datasetId + "&limit=10000";

    const select = document.getElementById("vehicleClassSelect");
    const ctx = document.getElementById("coeChart").getContext("2d");
    const yearCheckboxesDiv = document.getElementById("yearCheckboxes");
    const toggleAll = document.getElementById("toggleAllYears");
    const toggleQuota = document.getElementById("toggleQuota");
    const toggleBids = document.getElementById("toggleBids");
    const clickInfo = document.getElementById("clickInfo");

    let chart;
    let parsedData = [];
    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    fetch(url)
      .then(response => response.json())
      .then(data => {
        const records = data.result.records;
        parsedData = records.map(r => {
          const [year, month] = r.month.split("-");
          const monthLabel = monthNames[parseInt(month, 10) - 1];
          return {
            bidding_label: `${monthLabel}-${r.bidding_no}`,
            year: parseInt(year),
            vehicle_class: r.vehicle_class,
            premium: parseFloat(r.premium),
            quota: parseInt(r.quota),
            bids: isNaN(parseInt(r.bids_received?.replace(/,/g, ''))) ? null : parseInt(r.bids_received.replace(/,/g, ''))

          };
        }).filter(r => !isNaN(r.premium));

        const vehicleClasses = [...new Set(parsedData.map(r => r.vehicle_class))].sort();
        vehicleClasses.forEach(vc => {
          const option = document.createElement("option");
          option.value = vc;
          option.textContent = vc;
          select.appendChild(option);
        });

        select.value = vehicleClasses[0];
        updateChart(select.value);
        select.addEventListener("change", () => updateChart(select.value));
      });

    function updateChart(selectedClass) {
      const data = parsedData.filter(d => d.vehicle_class === selectedClass);
      if (data.length === 0) return;

      const labelOrder = monthNames.flatMap(m => [`${m}-1`, `${m}-2`]);
      const grouped = {};
      data.forEach(entry => {
        if (!grouped[entry.year]) grouped[entry.year] = [];
        grouped[entry.year].push(entry);
      });

      const currentYear = new Date().getFullYear();
      const datasets = [];
      const colorPalette = ['#3366cc', '#dc3912', '#ff9900', '#109618', '#990099', '#0099c6', '#dd4477', '#66aa00', '#b82e2e', '#316395'];
      let colorIndex = 0;

      Object.entries(grouped).forEach(([year, values]) => {
        const yearColor = colorPalette[colorIndex++ % colorPalette.length];
        const isVisible = parseInt(year) === currentYear;

        const premiums = [], quotas = [], bids = [];
        labelOrder.forEach(label => {
          const match = values.find(v => v.bidding_label === label);
          premiums.push(match ? match.premium : null);
          quotas.push(match && !isNaN(match.quota) ? match.quota : null);
          bids.push(match && !isNaN(match.bids) ? match.bids : null);
        });

        datasets.push({ label: year, data: premiums, borderColor: yearColor, borderWidth: 1, pointRadius: 2, pointHoverRadius: 5, hidden: !isVisible, spanGaps: true, fill: false, tension: 0.2, yAxisID: 'y' });
        datasets.push({ label: year + " Quota", data: quotas, borderColor: yearColor, borderDash: [4, 4], borderWidth: 1, hidden: !isVisible || !toggleQuota.checked, spanGaps: true, fill: false, tension: 0.2, pointRadius: 0, yAxisID: 'y1' });
        datasets.push({ label: year + " Bids", data: bids, borderColor: yearColor, borderDash: [2, 6], borderWidth: 2, hidden: !isVisible || !toggleBids.checked, spanGaps: true, fill: false, tension: 0.2, pointRadius: 0, yAxisID: 'y2' });
      });

      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: { labels: labelOrder, datasets },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'top',
              labels: {
                filter: (item, data) => {
                  const label = item.text;
                  const ds = data.datasets[item.datasetIndex];
                  return !label.endsWith("Quota") && !label.endsWith("Bids") && !ds.hidden;
                }
              }
            },
            title: {
              display: true,
              text: `COE Premiums for ${selectedClass} (Overlayed by Year)`
            }
          },
          scales: {
            x: { title: { display: true, text: 'Bidding Round' } },
            y: { title: { display: true, text: 'Premium (S$)' }, beginAtZero: true },
            y1: { title: { display: true, text: 'Quota' }, beginAtZero: true, position: 'right', grid: { drawOnChartArea: false } },
            y2: { title: { display: true, text: 'Bids Received' }, beginAtZero: true, position: 'right', offset: true, grid: { drawOnChartArea: false } }
          },
          onClick(evt, activeElements) {
            if (activeElements.length > 0) {
              const el = activeElements[0];
              const index = el.index;
              const groupStart = el.datasetIndex - (el.datasetIndex % 3);
              const year = chart.data.datasets[groupStart].label;
              const round = chart.data.labels[index];
              const premium = chart.data.datasets[groupStart].data[index];
              const quota = chart.data.datasets[groupStart + 1].data[index];
              const bids = chart.data.datasets[groupStart + 2].data[index];
              clickInfo.innerHTML = `
                🗓 Year: ${year}<br>
                📆 Bidding Round: ${round}<br>
                💰 Premium: $${premium?.toLocaleString() ?? "N/A"}<br>
                🎟 Quota: ${quota?.toLocaleString() ?? "N/A"}<br>
                🧾 Bids Received: ${bids?.toLocaleString() ?? "N/A"}`;
            }
          }
        }
      });

      yearCheckboxesDiv.innerHTML = '';
      for (let i = 0; i < datasets.length; i += 3) {
        const premiumDS = datasets[i];
        const quotaDS = datasets[i + 1];
        const bidsDS = datasets[i + 2];

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !premiumDS.hidden;
        cb.dataset.index = i;
        cb.addEventListener('change', () => {
          const checked = cb.checked;
          premiumDS.hidden = !checked;
          quotaDS.hidden = !checked || !toggleQuota.checked;
          bidsDS.hidden = !checked || !toggleBids.checked;
          chart.update();
          toggleAll.checked = [...yearCheckboxesDiv.querySelectorAll('input')].every(cb => cb.checked);
        });
        const label = document.createElement('label');
        label.style.marginRight = '15px';
        label.textContent = premiumDS.label;
        yearCheckboxesDiv.appendChild(cb);
        yearCheckboxesDiv.appendChild(label);
      }

      toggleAll.onchange = () => {
        yearCheckboxesDiv.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.checked = toggleAll.checked;
          const idx = parseInt(cb.dataset.index);
          chart.data.datasets[idx].hidden = !cb.checked;
          chart.data.datasets[idx + 1].hidden = !cb.checked || !toggleQuota.checked;
          chart.data.datasets[idx + 2].hidden = !cb.checked || !toggleBids.checked;
        });
        chart.update();
      };

      toggleQuota.onchange = () => {
        yearCheckboxesDiv.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          const idx = parseInt(cb.dataset.index);
          chart.data.datasets[idx + 1].hidden = !cb.checked || !toggleQuota.checked;
        });
        chart.update();
      };

      toggleBids.onchange = () => {
        yearCheckboxesDiv.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          const idx = parseInt(cb.dataset.index);
          chart.data.datasets[idx + 2].hidden = !cb.checked || !toggleBids.checked;
        });
        chart.update();
      };
    }
  </script>
</body>
</html>
