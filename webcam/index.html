<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Capture App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .camera-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            border-radius: 0;
            margin: 0;
            width: 100vw;
            height: 100vh;
        }

        #video {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        .camera-container.fullscreen #video {
            width: 100vw;
            height: 100vh;
        }

        #canvas {
            display: none;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls.outside {
            position: static;
            transform: none;
            left: auto;
            bottom: auto;
            background: none;
            backdrop-filter: none;
            padding: 0;
            border-radius: 0;
            border: none;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .controls button {
            min-width: 60px;
            padding: 12px 20px;
            font-size: 14px;
        }

        .controls.outside button {
            min-width: 120px;
            padding: 15px 30px;
            font-size: 16px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .capture-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            font-size: 18px;
            padding: 18px 35px;
        }

        .controls .capture-btn {
            font-size: 16px;
            padding: 14px 25px;
        }

        .controls.outside .capture-btn {
            font-size: 18px;
            padding: 18px 35px;
        }

        .fullscreen-btn {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
        }

        .fullscreen-btn:hover {
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.4);
        }

        .capture-btn:hover {
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
        }

        .status.error {
            background: rgba(255, 107, 107, 0.1);
            color: #e74c3c;
            border: 2px solid rgba(231, 76, 60, 0.2);
        }

        .status.success {
            background: rgba(46, 204, 113, 0.1);
            color: #27ae60;
            border: 2px solid rgba(39, 174, 96, 0.2);
        }

        .status.info {
            background: rgba(52, 152, 219, 0.1);
            color: #3498db;
            border: 2px solid rgba(52, 152, 219, 0.2);
        }

        .captured-photos {
            margin-top: 30px;
        }

        .photos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .photos-header h3 {
            margin: 0;
        }

        .toggle-photos-btn {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-photos-btn:hover {
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .photos-grid.hidden {
            display: none;
        }

        .photo-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .photo-item:hover {
            transform: scale(1.05);
        }

        .photo-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .photo-controls {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .photo-btn {
            background: none;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            line-height: 1;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
            width: 20px;
            height: 20px;
        }

        .photo-btn:hover {
            transform: scale(1.2);
            text-shadow: 0 0 5px rgba(0, 0, 0, 1);
        }

        .photo-btn.delete {
            color: #ff4757;
        }

        .photo-btn.delete:hover {
            color: #ff3838;
        }

        .photo-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .photo-modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-image {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }

        .modal-footer {
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            background: #f8f9fa;
        }

        .modal-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .modal-btn.danger {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }

        .modal-btn.danger:hover {
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            #video {
                height: 300px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Camera Capture</h1>
        
        <div id="status" class="status info">
            Click "Start Camera" to begin capturing photos
        </div>
        
        <div class="camera-container" id="cameraContainer">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas"></canvas>
            
            <div class="controls" id="controls">
                <button id="startBtn">Start Camera</button>
                <button id="captureBtn" class="capture-btn" disabled>Capture</button>
                <button id="switchBtn" disabled>Switch</button>
                <button id="fullscreenBtn" class="fullscreen-btn" disabled>Fullscreen</button>
                <button id="stopBtn" disabled>Stop</button>
            </div>
        </div>
        
        <div class="captured-photos">
            <div class="photos-header">
                <h3>Captured Photos (<span id="photoCount">0</span>)</h3>
                <button id="togglePhotosBtn" class="toggle-photos-btn">Hide Photos</button>
            </div>
            <div id="photosGrid" class="photos-grid"></div>
        </div>
    </div>

    <!-- Photo Modal -->
    <div id="photoModal" class="photo-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Photo Preview</div>
                <button id="modalClose" class="modal-close">×</button>
            </div>
            <img id="modalImage" class="modal-image" src="" alt="Photo preview">
            <div class="modal-footer">
                <button id="modalDownload" class="modal-btn">Download</button>
                <button id="modalDelete" class="modal-btn danger">Delete</button>
            </div>
        </div>
    </div>

    <script>
        class CameraApp {
            constructor() {
                this.video = document.getElementById('video');
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.cameraContainer = document.getElementById('cameraContainer');
                this.controls = document.getElementById('controls');
                this.startBtn = document.getElementById('startBtn');
                this.captureBtn = document.getElementById('captureBtn');
                this.switchBtn = document.getElementById('switchBtn');
                this.fullscreenBtn = document.getElementById('fullscreenBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.status = document.getElementById('status');
                this.photosGrid = document.getElementById('photosGrid');
                this.photoCount = document.getElementById('photoCount');
                this.togglePhotosBtn = document.getElementById('togglePhotosBtn');
                this.photoModal = document.getElementById('photoModal');
                this.modalImage = document.getElementById('modalImage');
                this.modalClose = document.getElementById('modalClose');
                this.modalDownload = document.getElementById('modalDownload');
                this.modalDelete = document.getElementById('modalDelete');
                
                this.stream = null;
                this.facingMode = 'user'; // 'user' for front camera, 'environment' for back camera
                this.capturedPhotos = [];
                this.isFullscreen = false;
                this.photosVisible = true;
                this.currentPhotoId = null;
                
                this.initializeEventListeners();
            }
            
            initializeEventListeners() {
                this.startBtn.addEventListener('click', () => this.startCamera());
                this.captureBtn.addEventListener('click', () => this.capturePhoto());
                this.switchBtn.addEventListener('click', () => this.switchCamera());
                this.fullscreenBtn.addEventListener('click', () => this.toggleFullscreen());
                this.stopBtn.addEventListener('click', () => this.stopCamera());
                this.togglePhotosBtn.addEventListener('click', () => this.togglePhotos());
                
                // Modal event listeners
                this.modalClose.addEventListener('click', () => this.closeModal());
                this.modalDownload.addEventListener('click', () => this.downloadCurrentPhoto());
                this.modalDelete.addEventListener('click', () => this.deleteCurrentPhoto());
                this.photoModal.addEventListener('click', (e) => {
                    if (e.target === this.photoModal) this.closeModal();
                });
                
                // Exit fullscreen on escape key
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (this.photoModal.classList.contains('active')) {
                            this.closeModal();
                        } else if (this.isFullscreen) {
                            this.toggleFullscreen();
                        }
                    }
                });
                
                // Handle fullscreen change events
                document.addEventListener('fullscreenchange', () => this.handleFullscreenChange());
                document.addEventListener('webkitfullscreenchange', () => this.handleFullscreenChange());
                document.addEventListener('mozfullscreenchange', () => this.handleFullscreenChange());
                document.addEventListener('MSFullscreenChange', () => this.handleFullscreenChange());
            }
            
            async startCamera() {
                try {
                    this.showStatus('Starting camera...', 'info');
                    
                    const constraints = {
                        video: {
                            facingMode: this.facingMode,
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    };
                    
                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.video.srcObject = this.stream;
                    
                    this.video.onloadedmetadata = () => {
                        this.canvas.width = this.video.videoWidth;
                        this.canvas.height = this.video.videoHeight;
                    };
                    
                    this.showStatus('Camera started successfully!', 'success');
                    this.updateButtonStates(true);
                    this.updateControlsLayout();
                    
                } catch (error) {
                    console.error('Error accessing camera:', error);
                    this.showStatus('Error: Could not access camera. Please check permissions.', 'error');
                }
            }
            
            async switchCamera() {
                if (this.stream) {
                    this.stopCamera();
                    this.facingMode = this.facingMode === 'user' ? 'environment' : 'user';
                    await this.startCamera();
                }
            }
            
            capturePhoto() {
                if (this.video.videoWidth === 0 || this.video.videoHeight === 0) {
                    this.showStatus('Camera not ready. Please wait...', 'error');
                    return;
                }
                
                // Set canvas size to match video
                this.canvas.width = this.video.videoWidth;
                this.canvas.height = this.video.videoHeight;
                
                // Draw the current frame
                this.ctx.drawImage(this.video, 0, 0);
                
                // Convert to data URL
                const dataURL = this.canvas.toDataURL('image/jpeg', 0.9);
                
                // Store the photo
                const photoData = {
                    dataURL: dataURL,
                    timestamp: new Date().toLocaleString(),
                    id: Date.now()
                };
                
                this.capturedPhotos.push(photoData);
                this.displayPhoto(photoData);
                this.updatePhotoCount();
                
                this.showStatus('Photo captured successfully!', 'success');
                
                // Add capture effect
                this.addCaptureEffect();
            }
            
            addCaptureEffect() {
                this.video.style.filter = 'brightness(1.5)';
                setTimeout(() => {
                    this.video.style.filter = 'none';
                }, 150);
            }
            
            toggleFullscreen() {
                if (!this.isFullscreen) {
                    this.enterFullscreen();
                } else {
                    this.exitFullscreen();
                }
            }
            
            enterFullscreen() {
                this.cameraContainer.classList.add('fullscreen');
                this.isFullscreen = true;
                this.fullscreenBtn.textContent = 'Exit Fullscreen';
                this.fullscreenBtn.title = 'Exit Fullscreen';
                this.updateControlsLayout();
                
                // Try to enter browser fullscreen
                if (this.cameraContainer.requestFullscreen) {
                    this.cameraContainer.requestFullscreen();
                } else if (this.cameraContainer.webkitRequestFullscreen) {
                    this.cameraContainer.webkitRequestFullscreen();
                } else if (this.cameraContainer.mozRequestFullScreen) {
                    this.cameraContainer.mozRequestFullScreen();
                } else if (this.cameraContainer.msRequestFullscreen) {
                    this.cameraContainer.msRequestFullscreen();
                }
            }
            
            exitFullscreen() {
                this.cameraContainer.classList.remove('fullscreen');
                this.isFullscreen = false;
                this.fullscreenBtn.textContent = 'Fullscreen';
                this.fullscreenBtn.title = 'Enter Fullscreen';
                this.updateControlsLayout();
                
                // Exit browser fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
            
            handleFullscreenChange() {
                const isInFullscreen = !!(document.fullscreenElement || 
                                         document.webkitFullscreenElement || 
                                         document.mozFullScreenElement || 
                                         document.msFullscreenElement);
                
                if (!isInFullscreen && this.isFullscreen) {
                    this.exitFullscreen();
                }
            }
            
            updateControlsLayout() {
                if (this.isFullscreen) {
                    this.controls.classList.remove('outside');
                    // Update button text for overlay mode
                    this.startBtn.textContent = 'Start';
                    this.captureBtn.textContent = 'Capture';
                    this.switchBtn.textContent = 'Switch';
                    this.stopBtn.textContent = 'Stop';
                } else {
                    this.controls.classList.add('outside');
                    // Update button text for normal mode
                    this.startBtn.textContent = 'Start Camera';
                    this.captureBtn.textContent = 'Capture Photo';
                    this.switchBtn.textContent = 'Switch Camera';
                    this.stopBtn.textContent = 'Stop Camera';
                }
            }
            
            displayPhoto(photoData) {
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                photoItem.setAttribute('data-photo-id', photoData.id);
                
                photoItem.innerHTML = `
                    <img src="${photoData.dataURL}" alt="Captured photo" onclick="app.openModal('${photoData.id}')">
                    <div class="photo-controls">
                        <button class="photo-btn" onclick="app.downloadPhoto('${photoData.id}')" title="Download">
                            💾
                        </button>
                        <button class="photo-btn delete" onclick="app.deletePhoto('${photoData.id}')" title="Delete">
                            🗑️
                        </button>
                    </div>
                `;
                
                this.photosGrid.insertBefore(photoItem, this.photosGrid.firstChild);
            }
            
            openModal(photoId) {
                const photo = this.capturedPhotos.find(p => p.id == photoId);
                if (photo) {
                    this.currentPhotoId = photoId;
                    this.modalImage.src = photo.dataURL;
                    this.photoModal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            }
            
            closeModal() {
                this.photoModal.classList.remove('active');
                this.currentPhotoId = null;
                document.body.style.overflow = '';
            }
            
            downloadCurrentPhoto() {
                if (this.currentPhotoId) {
                    this.downloadPhoto(this.currentPhotoId);
                }
            }
            
            deleteCurrentPhoto() {
                if (this.currentPhotoId) {
                    this.deletePhoto(this.currentPhotoId);
                    this.closeModal();
                }
            }
            
            deletePhoto(photoId) {
                const photoIndex = this.capturedPhotos.findIndex(p => p.id == photoId);
                if (photoIndex !== -1) {
                    // Remove from array
                    this.capturedPhotos.splice(photoIndex, 1);
                    
                    // Remove from DOM
                    const photoElement = document.querySelector(`[data-photo-id="${photoId}"]`);
                    if (photoElement) {
                        photoElement.remove();
                    }
                    
                    this.updatePhotoCount();
                    this.showStatus('Photo deleted', 'info');
                }
            }
            
            togglePhotos() {
                this.photosVisible = !this.photosVisible;
                if (this.photosVisible) {
                    this.photosGrid.classList.remove('hidden');
                    this.togglePhotosBtn.textContent = 'Hide Photos';
                } else {
                    this.photosGrid.classList.add('hidden');
                    this.togglePhotosBtn.textContent = 'Show Photos';
                }
            }
            
            downloadPhoto(photoId) {
                const photo = this.capturedPhotos.find(p => p.id == photoId);
                if (photo) {
                    const link = document.createElement('a');
                    link.download = `photo_${photo.timestamp.replace(/[/:,\s]/g, '_')}.jpg`;
                    link.href = photo.dataURL;
                    link.click();
                }
            }
            
            updatePhotoCount() {
                this.photoCount.textContent = this.capturedPhotos.length;
            }
            
            stopCamera() {
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.video.srcObject = null;
                    this.stream = null;
                    this.showStatus('Camera stopped', 'info');
                    this.updateButtonStates(false);
                    this.updateControlsLayout();
                    
                    // Exit fullscreen if active
                    if (this.isFullscreen) {
                        this.exitFullscreen();
                    }
                }
            }
            
            updateButtonStates(cameraActive) {
                this.startBtn.disabled = cameraActive;
                this.captureBtn.disabled = !cameraActive;
                this.switchBtn.disabled = !cameraActive;
                this.fullscreenBtn.disabled = !cameraActive;
                this.stopBtn.disabled = !cameraActive;
            }
            
            showStatus(message, type) {
                this.status.textContent = message;
                this.status.className = `status ${type}`;
            }
        }
        
        // Initialize the app
        const app = new CameraApp();
        
        // Check for camera support
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            app.showStatus('Camera not supported in this browser', 'error');
        }
    </script>
</body>
</html>
