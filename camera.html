<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Capture App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .camera-container {
            position: relative;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #video {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        #canvas {
            display: none;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .capture-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            font-size: 18px;
            padding: 18px 35px;
        }

        .capture-btn:hover {
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
        }

        .status.error {
            background: rgba(255, 107, 107, 0.1);
            color: #e74c3c;
            border: 2px solid rgba(231, 76, 60, 0.2);
        }

        .status.success {
            background: rgba(46, 204, 113, 0.1);
            color: #27ae60;
            border: 2px solid rgba(39, 174, 96, 0.2);
        }

        .status.info {
            background: rgba(52, 152, 219, 0.1);
            color: #3498db;
            border: 2px solid rgba(52, 152, 219, 0.2);
        }

        .captured-photos {
            margin-top: 30px;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .photo-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .photo-item:hover {
            transform: scale(1.05);
        }

        .photo-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .photo-item .download-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            #video {
                height: 300px;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Camera Capture</h1>
        
        <div id="status" class="status info">
            Click "Start Camera" to begin capturing photos
        </div>
        
        <div class="camera-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas"></canvas>
        </div>
        
        <div class="controls">
            <button id="startBtn">Start Camera</button>
            <button id="captureBtn" class="capture-btn" disabled>📸 Capture Photo</button>
            <button id="switchBtn" disabled>🔄 Switch Camera</button>
            <button id="stopBtn" disabled>Stop Camera</button>
        </div>
        
        <div class="captured-photos">
            <h3>Captured Photos (<span id="photoCount">0</span>)</h3>
            <div id="photosGrid" class="photos-grid"></div>
        </div>
    </div>

    <script>
        class CameraApp {
            constructor() {
                this.video = document.getElementById('video');
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.startBtn = document.getElementById('startBtn');
                this.captureBtn = document.getElementById('captureBtn');
                this.switchBtn = document.getElementById('switchBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.status = document.getElementById('status');
                this.photosGrid = document.getElementById('photosGrid');
                this.photoCount = document.getElementById('photoCount');
                
                this.stream = null;
                this.facingMode = 'user'; // 'user' for front camera, 'environment' for back camera
                this.capturedPhotos = [];
                
                this.initializeEventListeners();
            }
            
            initializeEventListeners() {
                this.startBtn.addEventListener('click', () => this.startCamera());
                this.captureBtn.addEventListener('click', () => this.capturePhoto());
                this.switchBtn.addEventListener('click', () => this.switchCamera());
                this.stopBtn.addEventListener('click', () => this.stopCamera());
            }
            
            async startCamera() {
                try {
                    this.showStatus('Starting camera...', 'info');
                    
                    const constraints = {
                        video: {
                            facingMode: this.facingMode,
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    };
                    
                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.video.srcObject = this.stream;
                    
                    this.video.onloadedmetadata = () => {
                        this.canvas.width = this.video.videoWidth;
                        this.canvas.height = this.video.videoHeight;
                    };
                    
                    this.showStatus('Camera started successfully!', 'success');
                    this.updateButtonStates(true);
                    
                } catch (error) {
                    console.error('Error accessing camera:', error);
                    this.showStatus('Error: Could not access camera. Please check permissions.', 'error');
                }
            }
            
            async switchCamera() {
                if (this.stream) {
                    this.stopCamera();
                    this.facingMode = this.facingMode === 'user' ? 'environment' : 'user';
                    await this.startCamera();
                }
            }
            
            capturePhoto() {
                if (this.video.videoWidth === 0 || this.video.videoHeight === 0) {
                    this.showStatus('Camera not ready. Please wait...', 'error');
                    return;
                }
                
                // Set canvas size to match video
                this.canvas.width = this.video.videoWidth;
                this.canvas.height = this.video.videoHeight;
                
                // Draw the current frame
                this.ctx.drawImage(this.video, 0, 0);
                
                // Convert to data URL
                const dataURL = this.canvas.toDataURL('image/jpeg', 0.9);
                
                // Store the photo
                const photoData = {
                    dataURL: dataURL,
                    timestamp: new Date().toLocaleString(),
                    id: Date.now()
                };
                
                this.capturedPhotos.push(photoData);
                this.displayPhoto(photoData);
                this.updatePhotoCount();
                
                this.showStatus('Photo captured successfully!', 'success');
                
                // Add capture effect
                this.addCaptureEffect();
            }
            
            addCaptureEffect() {
                this.video.style.filter = 'brightness(1.5)';
                setTimeout(() => {
                    this.video.style.filter = 'none';
                }, 150);
            }
            
            displayPhoto(photoData) {
                const photoItem = document.createElement('div');
                photoItem.className = 'photo-item';
                
                photoItem.innerHTML = `
                    <img src="${photoData.dataURL}" alt="Captured photo">
                    <button class="download-btn" onclick="app.downloadPhoto('${photoData.id}')" title="Download">
                        ⬇
                    </button>
                `;
                
                this.photosGrid.insertBefore(photoItem, this.photosGrid.firstChild);
            }
            
            downloadPhoto(photoId) {
                const photo = this.capturedPhotos.find(p => p.id == photoId);
                if (photo) {
                    const link = document.createElement('a');
                    link.download = `photo_${photo.timestamp.replace(/[/:,\s]/g, '_')}.jpg`;
                    link.href = photo.dataURL;
                    link.click();
                }
            }
            
            updatePhotoCount() {
                this.photoCount.textContent = this.capturedPhotos.length;
            }
            
            stopCamera() {
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.video.srcObject = null;
                    this.stream = null;
                    this.showStatus('Camera stopped', 'info');
                    this.updateButtonStates(false);
                }
            }
            
            updateButtonStates(cameraActive) {
                this.startBtn.disabled = cameraActive;
                this.captureBtn.disabled = !cameraActive;
                this.switchBtn.disabled = !cameraActive;
                this.stopBtn.disabled = !cameraActive;
            }
            
            showStatus(message, type) {
                this.status.textContent = message;
                this.status.className = `status ${type}`;
            }
        }
        
        // Initialize the app
        const app = new CameraApp();
        
        // Check for camera support
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            app.showStatus('Camera not supported in this browser', 'error');
        }
    </script>
</body>
</html>
