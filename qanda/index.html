<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Panel Q&A Navigator</title>
<style>
  :root{
    --bg1:#0f172a; --bg2:#4338ca;
    --card:#ffffff; --ink:#0f172a;
    --muted:#64748b; --brand:#4f46e5; --brand-700:#4338ca;
    --shadow:0 25px 50px -12px rgba(0,0,0,.25); --radius:20px;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(900px 560px at 110% 10%, rgba(67,56,202,.55) 0%, transparent 60%),
      linear-gradient(135deg, #1e293b 0%, var(--bg2) 100%);
    color:#fff;
    padding:clamp(12px,2.5vw,24px);
  }
  .container{max-width:1100px;margin-inline:auto}

  /* Top bar */
  .appbar{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    border-radius:14px; padding:10px 14px; backdrop-filter:blur(8px); margin-bottom:10px;
  }
  .title{display:flex;align-items:center;gap:10px}
  .badge{font:600 12px/1 system-ui;padding:6px 10px;border-radius:999px;background:rgba(99,102,241,.18);border:1px solid rgba(99,102,241,.35)}
  .title h1{margin:0;font:700 clamp(16px,2.2vw,20px)/1.2 system-ui}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);color:#e5e7eb;cursor:pointer;
    transition:transform .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.12);box-shadow:0 8px 18px rgba(0,0,0,.22)}
  .btn.primary{background:#fff;color:var(--brand);border-color:transparent}
  .icon{width:18px;height:18px}

  /* Progress */
  .progress-wrap{height:8px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.16);
    border-radius:999px;overflow:hidden;margin:10px 0}
  .progress{height:100%;width:0;background:linear-gradient(90deg,#a5b4fc,#4f46e5);transition:width .25s ease}

  /* State cards */
  .state{
    background:var(--card);color:var(--ink);border-radius:var(--radius);
    padding:clamp(20px,3.5vw,32px);box-shadow:var(--shadow);text-align:center;
  }
  .spinner{
    border:4px solid #e5e7eb;border-top:4px solid var(--brand);
    width:54px;height:54px;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Question card */
  .card{
    background:var(--card);color:var(--ink);border-radius:24px;box-shadow:var(--shadow);
    padding:clamp(18px,3vw,28px);margin-top:10px;margin-bottom:16px;
  }
  .meta{display:flex;gap:10px;align-items:baseline;color:var(--muted);flex-wrap:wrap}
  .name{color:var(--brand-700);font-weight:700}
  .underline{height:4px;width:80px;background:var(--brand);border-radius:2px;margin:10px 0 16px}
  .q{font-size:clamp(20px,3.6vw,40px);line-height:1.45;letter-spacing:.2px}

  /* Presenter controls */
  .controls{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .controls .group{display:flex;gap:10px;flex-wrap:wrap}

  .counter{color:#e5e7eb;font-weight:700}

  /* QR directly under questions */
  .qr-block{
    display:grid;place-items:center;gap:8px;margin-top:clamp(14px,3vw,22px);
    text-align:center;
  }
  .qr-img{
    width:clamp(220px,42vw,420px); /* bigger & responsive */
    height:auto;border-radius:12px;background:#fff;
    box-shadow:0 14px 28px rgba(0,0,0,.25);
  }
  .qr-caption{color:#e5e7eb;font-size:clamp(14px,2.2vw,16px)}
  .qr-caption a{color:#c7d2fe;text-decoration:underline}

  /* Loading/empty QR smaller */
  .qr-small{width:clamp(140px,28vw,220px)}

  /* Responsive tweaks */
  @media (max-width:740px){
    .controls{justify-content:center}
    .counter{order:3;width:100%;text-align:center}
  }

  .hidden{display:none}
</style>
</head>
<body>
  <div class="container">
    <!-- Top bar -->
    <div class="appbar">
      <div class="title">
        <span class="badge">Panel</span>
        <h1>Learning for the Future — Q&amp;A</h1>
      </div>
      <div class="actions">
        <button class="btn" id="btnAnon" onclick="toggleAnon()" title="Hide/show student identity">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 12s3-6 10-6 10 6 10 6-3 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg>
          Anonymise
        </button>
        <button class="btn" onclick="loadQuestions()" title="Reload questions">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          Refresh
        </button>
        <button class="btn primary" onclick="toggleFullscreen()" title="Fullscreen">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 3H5a2 2 0 0 0-2 2v4"/><path d="M15 3h4a2 2 0 0 1 2 2v4"/><path d="M9 21H5a2 2 0 0 1-2-2v-4"/><path d="M15 21h4a2 2 0 0 0 2-2v-4"/></svg>
          Fullscreen
        </button>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap" aria-hidden="true"><div id="progress" class="progress"></div></div>

    <!-- LOADING -->
    <section id="loading" class="state">
      <div class="spinner" role="status" aria-label="Loading"></div>
      <p style="color:#334155">Loading questions…</p>
      <h2 style="margin-top:6px">Learning for the Future. Panel Discussion.</h2>
      <div class="qr-block" style="margin-top:12px">
        <img class="qr-img qr-small" src="https___for.edu.sg_qanda.png" alt="Scan to ask a question at for.edu.sg/qanda"/>
        <div class="qr-caption" style="color:#374151">Ask your question: <a href="https://for.edu.sg/qanda" target="_blank" rel="noopener">for.edu.sg/qanda</a></div>
      </div>
    </section>

    <!-- ERROR -->
    <section id="error" class="state hidden">
      <h2 style="color:#dc2626;margin-bottom:6px">Error</h2>
      <p id="error-message" style="color:#4b5563;margin-bottom:14px"></p>
      <button class="btn primary" onclick="loadQuestions()">Try Again</button>
    </section>

    <!-- NO QUESTIONS -->
    <section id="no-questions" class="state hidden">
      <h2>No Questions Yet</h2>
      <p style="color:#6b7280;margin:6px 0 14px">Waiting for responses…</p>
      <button class="btn primary" onclick="loadQuestions()">Refresh</button>
      <div class="qr-block">
        <img class="qr-img" src="https___for.edu.sg_qanda.png" alt="Scan to ask a question at for.edu.sg/qanda"/>
        <div class="qr-caption">Students: <a href="https://for.edu.sg/qanda" target="_blank" rel="noopener">for.edu.sg/qanda</a></div>
      </div>
    </section>

    <!-- MAIN -->
    <section id="main-content" class="hidden" aria-live="polite" aria-atomic="true">
      <div class="card">
        <div class="meta">
          <div class="name" id="question-name"></div>
          <div id="question-class"></div>
        </div>
        <div class="underline" aria-hidden="true"></div>
        <div class="q" id="question-text">—</div>
      </div>

      <div class="controls">
        <div class="group">
          <button class="btn" id="prev-btn" onclick="previousQuestion()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg>
            Previous
          </button>
          <button class="btn" id="next-btn" onclick="nextQuestion()">
            Next
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
        <div class="counter">Question <span id="current-index">1</span> of <span id="total-questions">0</span></div>
        <div class="group">
          <button class="btn" onclick="loadQuestions()">Refresh</button>
          <button class="btn" onclick="toggleAnon()">Anonymise</button>
        </div>
      </div>

      <!-- BIG, CENTERED QR directly below questions -->
      <div class="qr-block" aria-label="QR code to submit questions">
        <img class="qr-img" src="https___for.edu.sg_qanda.png" alt="Scan to ask a question at for.edu.sg/qanda">
        <div class="qr-caption">
          Ask your question: <a href="https://for.edu.sg/qanda" target="_blank" rel="noopener">for.edu.sg/qanda</a>
        </div>
      </div>
    </section>
  </div>

<script>
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySlNsQii7TMpUPcVxVo6yNmI_0fu2f3WkkTy13nk29SKVB7sTaMVvZTGxMJHBGmHEHOA/exec';
  var questions = [];
  var currentIndex = 0;
  var anonymise = false;

  function showOnly(id){
    ['loading','error','no-questions','main-content'].forEach(function(x){
      document.getElementById(x).classList.toggle('hidden', x!==id);
    });
  }

  function updateProgress(){
    var total = Math.max(questions.length,1);
    var pct = Math.min(100, ((currentIndex+1)/total)*100);
    document.getElementById('progress').style.width = pct + '%';
    document.getElementById('current-index').textContent = Math.min(currentIndex+1,total);
    document.getElementById('total-questions').textContent = total;
    document.getElementById('prev-btn').disabled = currentIndex===0;
    document.getElementById('next-btn').disabled = currentIndex>=total-1;
  }

  function render(){
    if(!questions.length) return;
    var q = questions[currentIndex];
    document.getElementById('question-name').textContent = anonymise ? 'Anonymous' : (q.name||'');
    document.getElementById('question-class').textContent = anonymise ? '' : (q.class||'');
    document.getElementById('question-text').textContent = q.question || '';
    updateProgress();
  }

  function loadQuestions(){
    showOnly('loading');
    fetch(SCRIPT_URL + '?t=' + Date.now(), { cache:'no-store' })
      .then(function(res){
        var ct = res.headers.get('content-type')||'';
        if(ct.includes('application/json')) return res.json();
        return res.text().then(function(t){ try{return JSON.parse(t);}catch{throw new Error('Non-JSON response');} });
      })
      .then(function(data){
        var arr = Array.isArray(data) ? data : (Array.isArray(data && data.questions) ? data.questions : []);
        questions = arr.map(normalise).filter(function(x){return x.question;});
        if(questions.length){ currentIndex=0; render(); showOnly('main-content'); }
        else { showOnly('no-questions'); }
      })
      .catch(function(err){
        document.getElementById('error-message').textContent = 'Failed to load questions. ' + (err && err.message || '');
        showOnly('error');
      });
  }

  function normalise(it){
    function pick(obj, keys){
      for(var i=0;i<keys.length;i++){
        var k = keys[i];
        if(obj[k]!=null) return String(obj[k]);
        var f = Object.keys(obj).find(function(key){return key.toLowerCase()===k.toLowerCase();});
        if(f) return String(obj[f]);
      }
      return '';
    }
    return {
      name: pick(it, ['name','student','displayName']),
      class: pick(it, ['class','className','group','formClass']),
      question: pick(it, ['question','q','text','message'])
    };
  }

  function previousQuestion(){ if(currentIndex>0){ currentIndex--; render(); } }
  function nextQuestion(){ if(currentIndex<questions.length-1){ currentIndex++; render(); } }
  function toggleAnon(){ anonymise=!anonymise; render(); }
  function toggleFullscreen(){ if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); } else { document.exitFullscreen?.(); } }

  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowLeft') previousQuestion();
    else if(e.key==='ArrowRight') nextQuestion();
    else if(e.key.toLowerCase()==='a') toggleAnon();
    else if(e.key.toLowerCase()==='f') toggleFullscreen();
  });

  loadQuestions();
</script>
</body>
</html>
