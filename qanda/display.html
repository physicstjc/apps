<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Panel Q&A — Display View</title>
<style>
  :root{
    --bg2:#4338ca; --card:#ffffff; --ink:#0f172a;
    --muted:#64748b; --brand:#4f46e5;
    --shadow:0 25px 50px -12px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{
    margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(900px 560px at 110% 10%, rgba(67,56,202,.55) 0%, transparent 60%),
      linear-gradient(135deg, #1e293b 0%, var(--bg2) 100%);
    color:#fff; padding:clamp(12px,2.5vw,24px);
  }
  .container{max-width:1100px;margin-inline:auto}

  .appbar{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
    border-radius:14px; padding:10px 14px; backdrop-filter:blur(8px); margin-bottom:10px;
  }
  .title{display:flex;align-items:center;gap:10px}
  .badge{font:600 12px/1 system-ui;padding:6px 10px;border-radius:999px;background:rgba(99,102,241,.18);border:1px solid rgba(99,102,241,.35)}
  .title h1{margin:0;font:700 clamp(16px,2.2vw,20px)/1.2 system-ui}
  .status{display:flex;align-items:center;gap:10px;font-size:14px;color:#e5e7eb}
  .dot{width:10px;height:10px;border-radius:999px;background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.2)}
  .dot.ok{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}

  .card{
    background:var(--card);color:var(--ink);border-radius:24px;box-shadow:var(--shadow);
    padding:clamp(18px,3vw,28px);margin-top:10px;margin-bottom:16px; min-height:30vh;
  }
  .meta{display:flex;gap:10px;align-items:baseline;color:var(--muted);flex-wrap:wrap}
  .name{color:#4338ca;font-weight:700}
  .underline{height:4px;width:80px;background:var(--brand);border-radius:2px;margin:10px 0 16px}
  .q{font-size:clamp(22px,4vw,44px);line-height:1.45;letter-spacing:.2px;min-height:3lh}

  .qr-block{display:grid;place-items:center;gap:8px;margin-top:clamp(14px,3vw,22px);text-align:center}
  .qr-img{width:clamp(220px,42vw,420px);height:auto;border-radius:12px;background:#fff;box-shadow:0 14px 28px rgba(0,0,0,.25)}
  .qr-caption{color:#e5e7eb;font-size:clamp(14px,2.2vw,16px)}
  .qr-caption a{color:#c7d2fe;text-decoration:underline}

  .hint{color:#c7d2fe;font-size:14px;margin-top:8px;text-align:center}
</style>
</head>
<body>
  <div class="container">
    <div class="appbar">
      <div class="title">
        <span class="badge">Display</span>
        <h1>Learning for the Future — Q&amp;A</h1>
      </div>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="status-text">Waiting for main page…</span>
      </div>
    </div>

    <section class="card">
      <div class="meta">
        <div class="name" id="name"></div>
        <div id="klass"></div>
      </div>
      <div class="underline" aria-hidden="true"></div>
      <div class="q" id="question">Open the main panelist page to begin.</div>
      <div class="hint">This view updates automatically when you navigate/bookmark on the main page.</div>
    </section>

    <div class="qr-block">
      <img class="qr-img" src="https___for.edu.sg_qanda.png" alt="Scan to ask a question at for.edu.sg/qanda">
      <div class="qr-caption">
        Ask your question: <a href="https://for.edu.sg/qanda" target="_blank" rel="noopener">for.edu.sg/qanda</a>
      </div>
    </div>
  </div>

<script>
  // ===== Config =====
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySlNsQii7TMpUPcVxVo6yNmI_0fu2f3WkkTy13nk29SKVB7sTaMVvZTGxMJHBGmHEHOA/exec';
  const BC_NAME = 'panel_qna_channel_v1';
  const SYNC_KEY = 'panel_qna_sync_v1';

  // ===== State =====
  let questions = [];   // normalized
  let qMap = {};        // id -> question
  let lastState = null; // latest state from main page

  // ===== Normalisation (matches main page) =====
  function pick(obj, keys){
    for (let k of keys){
      if (obj[k] != null) return String(obj[k]);
      const f = Object.keys(obj).find(key=>key.toLowerCase()===k.toLowerCase());
      if (f) return String(obj[f]);
    }
    return '';
  }
  function hashId(q){
    const s = (q.name||'') + '|' + (q.class||'') + '|' + (q.question||'');
    let h = 0; for (let i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; }
    return 'q_' + (h>>>0).toString(36);
  }
  function normalise(it){
    const q = {
      name: pick(it, ['name','student','displayName']),
      class: pick(it, ['class','className','group','formClass']),
      question: pick(it, ['question','q','text','message'])
    };
    q._id = hashId(q);
    return q;
  }

  // ===== Data load =====
  function loadQuestions(){
    return fetch(SCRIPT_URL + '?t=' + Date.now(), { cache:'no-store' })
      .then(res => res.headers.get('content-type')?.includes('application/json') ? res.json() : res.text().then(t=>JSON.parse(t)))
      .then(data=>{
        const arr = Array.isArray(data) ? data : (Array.isArray(data?.questions) ? data.questions : []);
        questions = arr.map(normalise).filter(x=>x.question);
        qMap = Object.fromEntries(questions.map(q=>[q._id,q]));
        // try apply last state once data is ready
        if (lastState) applyState(lastState);
      })
      .catch(()=>{});
  }

  // ===== Rendering =====
  function render(q, anonymise){
    const dot = document.getElementById('dot');
    const st  = document.getElementById('status-text');
    dot.classList.add('ok');
    st.textContent = 'Live';

    document.getElementById('name').textContent  = anonymise ? 'Anonymous' : (q.name || '');
    document.getElementById('klass').textContent = anonymise ? '' : (q.class || '');
    document.getElementById('question').textContent = q.question || '—';
  }

  function applyState(state){
    lastState = state;
    const dot = document.getElementById('dot');
    const st  = document.getElementById('status-text');
    dot.classList.toggle('ok', true);
    st.textContent = 'Live';

    if (!state || !state.currentId){
      document.getElementById('question').textContent = 'No question selected.';
      return;
    }
    const q = qMap[state.currentId];
    if (q) {
      render(q, !!state.anonymise);
    } else {
      // We have state but not the matching data yet; ensure data is loading
      if (!questions.length) loadQuestions();
      document.getElementById('question').textContent = 'Loading question…';
    }
  }

  // ===== Subscribe (BroadcastChannel + localStorage fallback) =====
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(BC_NAME) : null;
  if (bc) bc.onmessage = (ev)=>applyState(ev.data);

  window.addEventListener('storage', function(e){
    if (e.key === SYNC_KEY && e.newValue){
      try { applyState(JSON.parse(e.newValue)); } catch(_){}
    }
  });

  // Initial sync from stored state (if main page already ran)
  try {
    const boot = localStorage.getItem(SYNC_KEY);
    if (boot) applyState(JSON.parse(boot));
  } catch(_){}

  // Load data and keep fresh occasionally (optional)
  loadQuestions();
  // setInterval(loadQuestions, 30000); // uncomment to refresh the pool
</script>
</body>
</html>
